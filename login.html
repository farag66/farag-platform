<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Farag Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
  <h1 class="text-2xl font-bold text-center mb-1">Farag Platform</h1>
  <p class="text-gray-500 text-center text-sm mb-6">سجل دخول بحساب أنشأه لك المدير فقط</p>
  <input id="email" type="email" placeholder="الإيميل" class="w-full border rounded-xl p-3 mb-3 outline-none">
  <input id="password" type="password" placeholder="كلمة السر" class="w-full border rounded-xl p-3 mb-4 outline-none">
  <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">دخول</button>
  <p id="error" class="text-red-500 text-center text-sm mt-3 hidden">الإيميل أو كلمة السر غلط</p>
  <p class="text-gray-400 text-center text-xs mt-6">لا يوجد إنشاء حساب - الحسابات ينشئها المدير فقط</p>
</div>
<script src="auth.js"></script>
<script>
function login(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const users = JSON.parse(localStorage.getItem('farag_users') || '[]');
  const found = users.find(u => u.email === email && u.password === btoa(pass));
  if(found){
    sessionStorage.setItem('farag_session', JSON.stringify({email: found.email, role: found.role, name: found.name}));
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('error').classList.remove('hidden');
  }
}
</script>
</body>
</html>
