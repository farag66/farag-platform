<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Farag</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f8f9fb] flex items-center justify-center min-h-screen p-6">
<div class="w-full max-w-[420px] bg-white p-8 rounded-2xl shadow-xl">
<h2 class="text-3xl font-black">Login</h2><p class="text-gray-500 text-sm mt-1 mb-6">Enter your credentials</p>
<label class="text-sm font-bold">Email Or FB ID</label>
<input id="email" value="admin@farag.com" class="w-full border rounded-lg px-4 py-3 mt-2 mb-4 outline-none focus:ring-2 focus:ring-blue-600">
<label class="text-sm font-bold">Password</label>
<input id="password" value="Admin123" type="password" class="w-full border rounded-lg px-4 py-3 mt-2 outline-none focus:ring-2 focus:ring-blue-600">
<p id="error" class="hidden text-red-600 text-sm mt-3 text-center"></p>
<button onclick="doLogin()" class="w-full bg-blue-700 text-white font-bold py-3.5 rounded-lg mt-6">Login ➜</button>
<button onclick="forceLogin()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg mt-3">⚡ دخول سريع - اضغط هنا لو الزر اللي فوق مش شغال</button>
<p class="text-center text-xs text-gray-400 mt-4">admin@farag.com / Admin123</p>
</div>
<script>
function forceLogin(){
  const user = {name:'Admin', email:'admin@farag.com', password:'Admin123', role:'admin'};
  localStorage.setItem('farag_users', JSON.stringify([user, {name:'farag', email:'timothytylor420@gmail.com', password:'123456', role:'user'}]));
  localStorage.setItem('farag_current_user', JSON.stringify(user));
  localStorage.setItem('farag_user', JSON.stringify(user));
  sessionStorage.setItem('farag_current_user', JSON.stringify(user));
  alert('تم الحفظ - هدخلك دلوقتي');
  window.location.href='dashboard.html';
}
function doLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('password').value.trim().toLowerCase();
  if((email==='admin@farag.com' && pass==='admin123') || (email==='timothytylor420@gmail.com' && pass==='123456')){
    forceLogin();
  }else{
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('error').textContent='Wrong - جرب الزرار الأخضر تحت';
  }
}
</script>
</body>
</html>
