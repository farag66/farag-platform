<style>
*{box-sizing:border-box}

@keyframes orbPro{0%,100%{transform:scale(1) rotate(0deg);box-shadow:0 0 28px rgba(167,139,250,.9),0 0 70px rgba(124,58,237,.6)}50%{transform:scale(1.12) rotate(8deg);box-shadow:0 0 42px rgba(167,139,250,1),0 0 100px rgba(124,58,237,.8)}}

.btn{width:100%;background:linear-gradient(145deg,#a78bfa,#7c3aed 55%,#5b21b6);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 12px 22px rgba(124,58,237,.5);position:relative;overflow:hidden}

function saveReplyTpl(){let kw=(document.getElementById('reply-kw').value||'').trim();let rp=(document.getElementById('reply-public').value||'').trim();let dm=(document.getElementById('reply-dm').value||'').trim();if(!kw){alert('اكتب الكلمة - مثلا: تم');return;}let a=DB.get('farag_reply_tpls',[]);a.unshift({id:Date.now(),kw:kw,reply:rp||'تم الرد عليك في الخاص يا فندم ❤️',dm:dm||'اهلا بيك'});DB.set('farag_reply_tpls',a);alert('✅ اتحفظ قالب الرد: '+kw);renderComment();}

function renderMedia(){
  // ترحيل مرة واحدة من الشكل القديم للشكل الجديد، عشان مفيش حاجة تضيع
  let folders = DB.get('farag_media_folders', []);
let items = DB.get('farag_media_items', []);
if(!Array.isArray(folders)) folders = [];
if(!Array.isArray(items)){
  let arr = [];
  Object.keys(items||{}).forEach(function(fid){
    (items[fid]||[]).forEach(function(it){
      arr.push({id:String(it.id||Date.now()), name:it.name, type:it.kind==='فيديو'?'video':it.kind==='بوست'?'post':'image', folder:String(fid)});
    });
  });
  items = arr;
  DB.set('farag_media_items', items);
}
let oldF = DB.get('farag_folders', null);
if(oldF && Array.isArray(oldF) && !DB.get('farag_media_migrated', false)){
  oldF.forEach(function(f){
    if(!folders.find(function(x){return String(x.id)===String(f.id);})){
      folders.push({id:String(f.id), name:f.name});
    }
  });
  DB.set('farag_media_folders', folders);
  DB.set('farag_media_migrated', true);
}
  let cur = window._mediaFolder || 'all';

function launchBroadcast(){
let selTpl=document.getElementById('bc-tpl');let tid=selTpl?parseInt(selTpl.value):bcTplId;
let list=DB.get('farag_tpl',[]);let tpl=list.find(function(x){return x.id===tid;});
if(!tpl){alert('اختار القالب الاول - من Create Template');return;}
let pages=[];if(bcSel.fb.angham)pages.push('انغام');if(bcSel.fb.behiya)pages.push('بهية');if(bcSel.fb.ganna)pages.push('جنه');if(bcSel.ig.angham)pages.push('انستجرام انغام');
if(pages.length===0){alert('اختار صفحة واحدة على الاقل');return;}
let labels=[];['VIP','New','Imported','Messaged','Replied','Old'].forEach(function(l){if(bcLabels[l])labels.push(l);});
if(labels.length===0){alert('اختار Label واحد على الاقل');return;}
let subs=DB.get('farag_subscribers',[]);let target=subs.filter(function(s){return pages.includes(s.page)&&labels.includes(s.label);});
let jobs=DB.get('farag_jobs',[]);jobs.unshift({id:Date.now(),type:bcType,tpl:tpl.name,pages:pages.join(' + '),labels:labels.join(' + '),count:target.length,status:'تم الإطلاق',time:new Date().toLocaleString('ar-EG')});DB.set('farag_jobs',jobs);
alert('🚀 تم إطلاق الحملة: '+tpl.name+' - على: '+pages.join(' + ')+' - لـ: '+labels.join(' + ')+' - العدد: '+target.length+' مشترك');
}
let bcSel={all:true,fbAll:true,igAll:true,fb:{angham:true,behiya:true,ganna:true},ig:{angham:true}};
let bcLabels={all:true,VIP:true,New:true,Imported:true,Messaged:true,Replied:true,Old:true};
let bcType='MARKETING';let bcTplId=null;
function toggleBcAll(c){bcSel.all=c;bcSel.fbAll=c;bcSel.igAll=c;bcSel.fb.angham=c;bcSel.fb.behiya=c;bcSel.fb.ganna=c;bcSel.ig.angham=c;renderBroadcast(bcType);}
function toggleBcFbAll(c){bcSel.fbAll=c;bcSel.fb.angham=c;bcSel.fb.behiya=c;bcSel.fb.ganna=c;bcSel.all=bcSel.fbAll&&bcSel.igAll;renderBroadcast(bcType);}
function toggleBcIgAll(c){bcSel.igAll=c;bcSel.ig.angham=c;bcSel.all=bcSel.fbAll&&bcSel.igAll;renderBroadcast(bcType);}
function toggleBcPage(g,k,c){bcSel[g][k]=c;if(g==='fb')bcSel.fbAll=bcSel.fb.angham&&bcSel.fb.behiya&&bcSel.fb.ganna;if(g==='ig')bcSel.igAll=bcSel.ig.angham;bcSel.all=bcSel.fbAll&&bcSel.igAll;renderBroadcast(bcType);}
function toggleBcLabelAll(c){Object.keys(bcLabels).forEach(function(k){bcLabels[k]=c;});renderBroadcast(bcType);}
function toggleBcLabel(k,c){bcLabels[k]=c;if(k!=='all'){let keys=['VIP','New','Imported','Messaged','Replied','Old'];bcLabels.all=keys.every(function(x){return bcLabels[x];});}renderBroadcast(bcType);}
function syncOldMessages(){let subs=DB.get('farag_subscribers',[]);let old=[{id:201,name:'عميل قديم 1',page:'انغام',label:'Old',ava:'💬',color:'#64748b',src:'Sync - رسايل قديمة',account:'فيسبوك'},{id:202,name:'عميل قديم 2',page:'بهية',label:'Messaged',ava:'💬',color:'#64748b',src:'Sync - مردش',account:'فيسبوك'},{id:203,name:'عميل قديم 3',page:'جنه',label:'Replied',ava:'💬',color:'#64748b',src:'Sync - رد قبل كده',account:'فيسبوك'}];old.forEach(function(o){if(!subs.find(function(s){return s.id===o.id;}))subs.push(o);});DB.set('farag_subscribers',subs);alert('✅ Sync تم: كل الرسايل القديمة بقت مشتركين - رد ومردش');renderBroadcast(bcType);}

renderMenu('dashboard');renderDashboard();
</script>
<script>function exportFaragData(){
let data={};
for(let i=0;i<localStorage.length;i++){
let k=localStorage.key(i);
data[k]=localStorage.getItem(k);
}
let txt=JSON.stringify(data,null,2);
let blob=new Blob([txt],{type:'application/json'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');
a.href=url;
a.download='farag-backup-'+new Date().toISOString().slice(0,10)+'.json';
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},1000);
alert('تم التصدير - عدد المفاتيح: '+Object.keys(data).length);
}

function importFaragData(e){
let file=e.target.files[0];if(!file)return;
let r=new FileReader();r.onload=function(){
try{let data=JSON.parse(r.result);Object.keys(data).forEach(function(k){localStorage.setItem(k, typeof data[k]==='string' ? data[k] : JSON.stringify(data[k]));});;alert('✅ تم الاستيراد - اعمل Refresh');location.reload();}
catch(err){alert('الملف ده مش صح');}
};r.readAsText(file);
}
let _faragBar=document.createElement('div');
_faragBar.innerHTML='<button onclick="exportFaragData()" style="background:#16a34a;color:#fff;border:none;padding:10px 14px;border-radius:99px;font-weight:900;cursor:pointer">📤 تصدير</button> <label style="background:#2563eb;color:#fff;padding:10px 14px;border-radius:99px;font-weight:900;cursor:pointer">📥 استيراد<input type="file" accept=".json" onchange="importFaragData(event)" style="display:none"></label>';
_faragBar.style.cssText='position:fixed;bottom:12px;left:12px;z-index:99999;display:flex;gap:8px';
document.body.appendChild(_faragBar);
</script></body>
