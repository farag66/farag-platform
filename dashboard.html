function renderBroadcast(){let all=bcs(),f=all.filter(b=>S.bcStatus==='all'||b.status===S.bcStatus);let bh='';f.slice(0,10).forEach(b=>{bh+='<tr class="border-b"><td class="px-3 py-3"><span class="badge" style="background:#e0f2fe;color:#0284c7">'+b.type+'</span></td><td class="px-3 py-3"><span class="badge" style="background:#dcfce7;color:#15803d">● '+b.status+'</span></td><td class="px-3 py-3"><div class="flex gap-1"><span class="bc-btn" style="--c:#2563eb;--c2:#60a5fa" onclick="showToast(\'👁 '+b.name+'\')">👁<span class="cloud">View</span></span><span class="bc-btn" style="--c:#16a34a;--c2:#4ade80" onclick="showToast(\'✏️ تعديل\')">✏️<span class="cloud">Edit</span></span><span class="bc-btn" style="--c:#ef4444;--c2:#f87171" onclick="delBc('+b.id+')">🗑<span class="cloud">Delete</span></span></div></td><td class="px-3 py-3 text-center">📄</td><td class="px-3 py-3 text-center">FB</td><td class="px-3 py-3 text-center">'+b.sub+'</td><td class="px-3 py-3 text-center">'+b.sent+'</td><td class="px-3 py-3 text-center">'+b.open+'</td><td class="px-3 py-3">'+b.sched+'</td><td class="px-3 py-3">'+b.created+'</td></tr>'});return '<h2 class="text-[22px] font-black">Subscriber broadcast</h2><div class="flex gap-2 mt-3 flex-wrap"><button onclick="S.bcStatus=\'all\';render()" class="bc-pill '+(S.bcStatus==='all'?'active':'')+'">All ('+all.length+')</button><button onclick="S.bcStatus=\'completed\';render()" class="bc-pill">🟢 Completed</button><button onclick="openBcCreate()" class="bc-pill">➕ New Broadcast</button></div><div id="bc-create" class="card12 p-4 mt-4 hidden"><input id="bc-name" class="input" placeholder="اسم البرودكاست"><button onclick="saveBc()" class="btn mt-3">🚀 Send Broadcast</button></div><div class="card12 mt-4 overflow-hidden"><table class="w-full text-left text-[12px] min-w-[820px]"><thead class="text-[10px] text-gray-500 border-b bg-gray-50"><tr><th class="px-3 py-3">TYPE</th><th class="px-3 py-3">STATUS</th><th class="px-3 py-3">ACTIONS</th><th class="px-3 py-3">MEDIA</th><th class="px-3 py-3">SUBSCRIBER</th><th class="px-3 py-3">SENT</th><th class="px-3 py-3">OPEN</th><th class="px-3 py-3">SCHEDULED AT</th><th class="px-3 py-3">CREATED AT</th></tr></thead><tbody>'+bh+'</tbody></table></div>'}
function renderMedia(){let cfg={media:{title:'Media Manager',bc:'Messenger Tools / Media Manager',icon:'🖼️',c:'#2563eb',c2:'#60a5fa',badge:'00 · 51 images',listsTitle:'MY LISTS',btnRandom:'🔀 Random URL',props:'<div>• Lists - 00 فيها 51 صورة</div><div>• Drag & drop - JPG · PNG · GIF · WEBP</div>',inner:[['all','📋 All Images']]},content:{title:'Content Manager',bc:'Messenger Tools / Content Manager',icon:'📄',c:'#16a34a',c2:'#4ade80',badge:'5 · 1 post',listsTitle:'MY CONTENT LISTS',btnRandom:'🔀 Random Post',props:'<div>• Spintax</div>',inner:[['all','📋 All Posts']]},video:{title:'Video Manager',bc:'Media Manager / Video Manager',icon:'🎬',c:'#ec4899',c2:'#f472b6',badge:'1 · 1 video',listsTitle:'MY VIDEO LISTS',btnRandom:'🔀 Random URL',props:'<div>• MP4 · WEBM · MOV · AVI · MKV · Max 10GB</div>',inner:[['all','📋 All Videos']]}}[S.mediaMode];let lists=S.mediaMode==='media'?mLists():S.mediaMode==='content'?cLists():vLists();let lh='';lists.forEach(l=>{lh+='<div class="list-item '+(S.activeList===l.id?'active':'')+'" onclick="S.activeList=\''+l.id+'\';render()"><span class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#ede9fe">'+cfg.icon+'</span><span class="flex-1 font-bold text-[13px]">'+l.name+'</span><span class="badge bg-violet-100 text-violet-700">'+l.count+'</span></div>'});let main='',grid='';if(S.mediaMode==='media'){main='<div class="card12 p-3"><div class="border-2 border-dashed border-blue-200 rounded-2xl p-4 text-center bg-blue-50/50" onclick="document.getElementById(\'media-upload\').click()"><div class="font-bold">Drag & drop images here</div></div></div>';grid='<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4">'+mItems().map(it=>'<div class="media-item" onclick="copyMedia(\''+it.url+'\')"><img src="'+it.url+'"><span class="media-del" onclick="event.stopPropagation();delMediaItem('+it.id+')">✕</span></div>').join('')+'</div>'}if(S.mediaMode==='content'){let lp=posts().filter(p=>p.list===S.activeList);main='<div class="card12 p-4"><textarea id="post-text" class="input" rows="3" placeholder="Write your post content here..."></textarea><button onclick="addPost()" class="px-4 py-2 rounded-lg text-white font-bold text-sm mt-3" style="background:#16a34a">+ Add Post</button></div>';grid='<div class="space-y-3 mt-4">'+lp.map(p=>'<div class="card12 p-4"><div>'+p.text+'</div><div class="flex gap-2 mt-3"><button onclick="editPost('+p.id+')" class="text-xs font-bold">✏️ Edit</button><button onclick="copyPost('+p.id+')" class="text-xs font-bold">📋 Copy</button><button onclick="delPost('+p.id+')" class="text-xs font-bold text-red-500">🗑 Delete</button></div></div>').join('')+'</div>'}if(S.mediaMode==='video'){let lv=videos().filter(v=>v.list===S.activeList);main='<div class="card12 p-3"><div class="border-2 border-dashed border-pink-200 rounded-2xl p-4 text-center bg-pink-50/50" onclick="document.getElementById(\'media-upload\').click()"><div class="font-bold">Drag & drop videos here</div><div class="text-[11px] text-gray-500">MP4 · WEBM · MOV · AVI · MKV · Max 10GB</div></div></div>';grid='<div class="grid md:grid-cols-2 gap-3 mt-4">'+lv.map(v=>'<div class="card12 overflow-hidden"><div class="relative"><img src="'+v.thumb+'" class="w-full h-[180px] object-cover"><span class="media-del" onclick="delVideo('+v.id+')">✕</span><div class="absolute inset-0 flex items-center justify-center"><span class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center text-xl">▶</span></div></div><div class="flex justify-between p-3 text-[12px]"><span>🎬 '+v.file+'</span><span>'+v.size+'</span></div></div>').join('')+'</div>'}return '<div class="flex justify-between gap-3 flex-wrap"><div><div class="text-[11px] text-gray-400 font-bold">'+cfg.bc+'</div><div class="flex items-center gap-2 mt-1"><span class="icon-cloud" style="--c:'+cfg.c+';--c2:'+cfg.c2+'">'+cfg.icon+'<span class="cloud">'+cfg.title+'</span></span><h2 class="text-[22px] font-black">'+cfg.title+'</h2><span class="bg-blue-100 text-blue-700 text-[11px] font-bold px-2 py-1 rounded-full">'+cfg.badge+'</span></div></div><div class="flex gap-2"><button onclick="randomMedia()" class="bc-pill">'+cfg.btnRandom+'</button><label class="bc-pill active cursor-pointer">☁️ Upload<input type="file" id="media-upload" accept="image/*,video/*" multiple class="hidden" onchange="uploadMedia(event)"></label></div></div><div class="flex gap-2 mt-4"><button onclick="openMedia(\'media\')" class="inner-tab '+(S.mediaMode==='media'?'active':'')+'">🖼️ Media Manager</button><button onclick="openMedia(\'content\')" class="inner-tab '+(S.mediaMode==='content'?'active':'')+'">📄 Content Manager</button><button onclick="openMedia(\'video\')" class="inner-tab '+(S.mediaMode==='video'?'active':'')+'">🎬 Video Manager</button></div><div class="flex flex-col md:flex-row gap-4 mt-4"><div class="card12 p-3 md:w-[240px] shrink-0"><div class="text-[10px] font-black text-gray-400">'+cfg.listsTitle+'</div><div class="flex gap-2 mt-2"><input id="new-list-name" class="input !py-2" placeholder="New list name..."><button onclick="addMediaList()" class="w-10 rounded-xl text-white font-black" style="background:#2563eb">+</button></div><div class="mt-3 space-y-1">'+lh+'</div></div><div class="flex-1">'+main+grid+'</div></div>'}
function renderSimple(title){return '<div class="card12 p-6 text-center"><div class="text-5xl mb-3">📡</div><h2 class="text-xl font-black">'+title+'</h2><button onclick="openPage(\'dashboard\')" class="mt-4 bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm">Back to Dashboard</button></div>'}
function renderCRUD(kind){let key={contacts:'farag_contacts',campaigns:'farag_campaigns',numbers:'farag_numbers',users:'farag_users'}[kind];let title={contacts:'Contacts',campaigns:'Campaigns',numbers:'Numbers',users:'Users'}[kind];let items=DB.get(key,[]);return '<div class="flex justify-between"><h2 class="text-xl font-black">'+title+' ('+items.length+')</h2><button onclick="document.getElementById(\'crud-form\').classList.toggle(\'hidden\')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm">+ Add</button></div><div id="crud-form" class="card12 p-4 mt-3 hidden"><input id="f1" class="input" placeholder="الاسم"><input id="f2" class="input mt-2" placeholder="بيانات"><button onclick="saveCRUD(\''+kind+'\')" class="btn mt-3">حفظ</button></div><div class="mt-3 space-y-2">'+items.map(it=>'<div class="card12 p-3 flex justify-between"><div class="font-bold text-sm">'+(it.name||it.label)+'</div><button onclick="delItem(\''+key+'\','+it.id+')" class="text-red-500 font-bold">حذف</button></div>').join('')+'</div>'}
function setFilter(f){S.filter=f;render()}
function togglePage(id){let ps=pages();let p=ps.find(x=>x.id===id);p.enabled=!p.enabled;DB.set('farag_pages',ps);render()}
function toggleSelect(id,v){let ps=pages();ps.find(x=>x.id===id).selected=v;DB.set('farag_pages',ps)}
function toggleSelectAll(v){let ps=pages();ps.forEach(p=>p.selected=v);DB.set('farag_pages',ps);render()}
function loginFacebook(){let name=prompt('اسم الأكونت؟','Yoka Karam');if(!name)return;let a=accounts();a.unshift({id:Date.now(),name:name});DB.set('farag_accounts',a);render();showToast('✅ تم ربط '+name)}
function scanAll(){showToast('⚡ جاري فحص كل الأكونتات...');setTimeout(()=>{render();showToast('✅ تم فحص '+accounts().length+' أكونت')},800)}
function unlinkAccount(id){if(!confirm('متأكد تفك ربط الأكونت؟'))return;DB.set('farag_accounts',accounts().filter(a=>a.id!==id));render();showToast('تم فك الربط')}
function enableAll(){let ps=pages();ps.forEach(p=>p.enabled=true);DB.set('farag_pages',ps);render();showToast('✅ تم تفعيل كل الصفحات')}
function disableAll(){let ps=pages();ps.forEach(p=>p.enabled=false);DB.set('farag_pages',ps);render();showToast('تم إيقاف كل الصفحات')}
function deleteAllPages(){if(!confirm('متأكد تمسح كل الصفحات؟'))return;DB.set('farag_pages',[]);render();showToast('تم مسح كل الصفحات')}
function saveTemplate(){let n=document.getElementById('gt-name')?.value.trim();if(!n)return alert('اكتب الاسم');let key='farag_comment_tpl';let a=DB.get(key,[]);a.unshift({id:Date.now(),name:n,text:''});DB.set(key,a);showToast('✅ تم الحفظ');render()}
function openBcCreate(){document.getElementById('bc-create').classList.remove('hidden')}
function saveBc(){let n=document.getElementById('bc-name').value.trim();if(!n)return alert('اكتب اسم البرودكاست');let a=bcs();a.unshift({id:Date.now(),type:'UTILITY',status:'pending',sub:0,sent:0,open:0,sched:'Now',created:new Date().toLocaleString('en-EG'),name:n});DB.set('farag_broadcasts',a);render();showToast('✅ تم إنشاء البرودكاست')}
function delBc(id){if(!confirm('متأكد تحذف؟'))return;DB.set('farag_broadcasts',bcs().filter(x=>x.id!==id));render()}
function addMediaList(){let n=document.getElementById('new-list-name').value.trim();if(!n)return alert('اكتب اسم القائمة');let id=Date.now().toString();let key=S.mediaMode==='media'?'farag_media_lists':S.mediaMode==='content'?'farag_content_lists':'farag_video_lists';let a=DB.get(key,[]);a.unshift({id:id,name:n,count:0});DB.set(key,a);S.activeList=id;render();showToast('✅ تم إنشاء قائمة '+n)}
function delMediaList(id){if(!confirm('متأكد تمسح القائمة؟'))return;let key=S.mediaMode==='media'?'farag_media_lists':S.mediaMode==='content'?'farag_content_lists':'farag_video_lists';DB.set(key,DB.get(key,[]).filter(l=>l.id!==id));render();showToast('تم مسح القائمة')}
function uploadMedia(e){let files=e.target.files;if(!files.length)return;for(let f of files){if(S.mediaMode==='video'){let v=videos();v.unshift({id:Date.now()+Math.random(),list:S.activeList,title:f.name,file:'1000100058',size:'10 MB',thumb:URL.createObjectURL(f)});DB.set('farag_videos',v)}else{let m=mItems();m.unshift({id:Date.now()+Math.random(),url:URL.createObjectURL(f),list:S.activeList,name:f.name,text:f.name});DB.set('farag_media_items',m)}}render();showToast('✅ تم رفع '+files.length+' ملف');e.target.value=''}
function delMediaItem(id){if(!confirm('متأكد تمسح الصورة؟'))return;DB.set('farag_media_items',mItems().filter(x=>x.id!==id));render();showToast('تم مسح الصورة')}
function copyMedia(url){if(navigator.clipboard)navigator.clipboard.writeText(url);showToast('✅ تم نسخ لينك الصورة')}
function randomMedia(){showToast('🔀 Random URL: تم نسخ لينك عشوائي')}
function addPost(){let t=document.getElementById('post-text').value.trim();if(!t)return alert('اكتب محتوى البوست');let a=posts();a.unshift({id:Date.now(),list:S.activeList,text:t,date:new Date().toISOString().slice(0,19).replace('T',' ')});DB.set('farag_posts',a);render();showToast('✅ تم إضافة البوست')}
function editPost(id){let p=posts().find(x=>x.id===id);let nt=prompt('عدل البوست:',p.text);if(nt){let a=posts();a.find(x=>x.id===id).text=nt;DB.set('farag_posts',a);render();showToast('✅ تم تعديل البوست')}}
function copyPost(id){let p=posts().find(x=>x.id===id);if(navigator.clipboard)navigator.clipboard.writeText(p.text);showToast('✅ تم نسخ البوست')}
function delPost(id){if(!confirm('متأكد تمسح البوست؟'))return;DB.set('farag_posts',posts().filter(x=>x.id!==id));render();showToast('تم مسح البوست')}
function delVideo(id){if(!confirm('متأكد تمسح الفيديو؟'))return;DB.set('farag_videos',videos().filter(x=>x.id!==id));render();showToast('تم مسح الفيديو')}
function saveCRUD(kind){let f1=document.getElementById('f1').value.trim(),f2=document.getElementById('f2').value.trim();if(!f1||!f2)return alert('اكمل البيانات');let key={contacts:'farag_contacts',campaigns:'farag_campaigns',numbers:'farag_numbers',users:'farag_users'}[kind];let a=DB.get(key,[]);a.unshift({id:Date.now(),name:f1,phone:f2,label:f1,email:f2,msg:f2,status:'Draft',date:new Date().toLocaleString('en-EG')});DB.set(key,a);render();showToast('تم الحفظ ✅')}
function sendCampaign(id){let a=DB.get('farag_campaigns',[]),c=a.find(x=>x.id===id);if(!c)return;c.status='Done';DB.set('farag_campaigns',a);render();showToast('تم إرسال الحملة')}
function delItem(key,id){if(!confirm('متأكد تحذف؟'))return;DB.set(key,DB.get(key,[]).filter(x=>x.id!==id));render();showToast('تم الحذف')}
function render(){renderSidebar();let h='';if(S.page==='dashboard')h=renderDashboard();else if(S.page==='facebook')h=renderFacebook();else if(S.page==='growth')h=renderGrowth();else if(S.page==='broadcasting')h=renderBroadcast();else if(S.page==='media')h=renderMedia();else if(['contacts','campaigns','numbers','users'].includes(S.page))h=renderCRUD(S.page);else h=renderSimple(S.page);document.getElementById('app').innerHTML=h;updateClock()}
render();
</script></body></html>
