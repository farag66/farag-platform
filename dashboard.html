<style>
*{box-sizing:border-box}

@keyframes orbPro{0%,100%{transform:scale(1) rotate(0deg);box-shadow:0 0 28px rgba(167,139,250,.9),0 0 70px rgba(124,58,237,.6)}50%{transform:scale(1.12) rotate(8deg);box-shadow:0 0 42px rgba(167,139,250,1),0 0 100px rgba(124,58,237,.8)}}

.btn{width:100%;background:linear-gradient(145deg,#a78bfa,#7c3aed 55%,#5b21b6);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 12px 22px rgba(124,58,237,.5);position:relative;overflow:hidden}

function saveReplyTpl(){let kw=(document.getElementById('reply-kw').value||'').trim();let rp=(document.getElementById('reply-public').value||'').trim();let dm=(document.getElementById('reply-dm').value||'').trim();if(!kw){alert('اكتب الكلمة - مثلا: تم');return;}let a=DB.get('farag_reply_tpls',[]);a.unshift({id:Date.now(),kw:kw,reply:rp||'تم الرد عليك في الخاص يا فندم ❤️',dm:dm||'اهلا بيك'});DB.set('farag_reply_tpls',a);alert('✅ اتحفظ قالب الرد: '+kw);renderComment();}

function renderMedia(){
  // ترحيل مرة واحدة من الشكل القديم للشكل الجديد، عشان مفيش حاجة تضيع
  let folders = DB.get('farag_media_folders', []);
let items = DB.get('farag_media_items', []);
if(!Array.isArray(folders)) folders = [];
if(!Array.isArray(items)){
  let arr = [];
  Object.keys(items||{}).forEach(function(fid){
    (items[fid]||[]).forEach(function(it){
      arr.push({id:String(it.id||Date.now()), name:it.name, type:it.kind==='فيديو'?'video':it.kind==='بوست'?'post':'image', folder:String(fid)});
    });
  });
  items = arr;
  DB.set('farag_media_items', items);
}
let oldF = DB.get('farag_folders', null);
if(oldF && Array.isArray(oldF) && !DB.get('farag_media_migrated', false)){
  oldF.forEach(function(f){
    if(!folders.find(function(x){return String(x.id)===String(f.id);})){
      folders.push({id:String(f.id), name:f.name});
    }
  });
  DB.set('farag_media_folders', folders);
  DB.set('farag_media_migrated', true);
}
  let cur = window._mediaFolder || 'all';

<script>function exportFaragData(){
let data={};
for(let i=0;i<localStorage.length;i++){
let k=localStorage.key(i);
data[k]=localStorage.getItem(k);
}
let txt=JSON.stringify(data,null,2);
let blob=new Blob([txt],{type:'application/json'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');
a.href=url;
a.download='farag-backup-'+new Date().toISOString().slice(0,10)+'.json';
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},1000);
alert('تم التصدير - عدد المفاتيح: '+Object.keys(data).length);
}

function importFaragData(e){
let file=e.target.files[0];if(!file)return;
let r=new FileReader();r.onload=function(){
try{let data=JSON.parse(r.result);Object.keys(data).forEach(function(k){localStorage.setItem(k, typeof data[k]==='string' ? data[k] : JSON.stringify(data[k]));});;alert('✅ تم الاستيراد - اعمل Refresh');location.reload();}
catch(err){alert('الملف ده مش صح');}
};r.readAsText(file);
}
let _faragBar=document.createElement('div');
_faragBar.innerHTML='<button onclick="exportFaragData()" style="background:#16a34a;color:#fff;border:none;padding:10px 14px;border-radius:99px;font-weight:900;cursor:pointer">📤 تصدير</button> <label style="background:#2563eb;color:#fff;padding:10px 14px;border-radius:99px;font-weight:900;cursor:pointer">📥 استيراد<input type="file" accept=".json" onchange="importFaragData(event)" style="display:none"></label>';
_faragBar.style.cssText='position:fixed;bottom:12px;left:12px;z-index:99999;display:flex;gap:8px';
document.body.appendChild(_faragBar);
</script></body>

')+' onchange="ctToggleFb(this.checked)"> ✅ تحديد الكل بتاع الاكونت ده</label></div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#fff"><label style="display:flex;gap:6px;cursor:pointer"><input type="checkbox" '+(ctSel.fb.angham?'checked':'')+' onchange="ctTogglePage(\'fb\',\'angham\',this.checked)"> صفحة انغام</label><label style="display:flex;gap:6px;cursor:pointer"><input type="checkbox" '+(ctSel.fb.behiya?'checked':'')+' onchange="ctTogglePage(\'fb\',\'behiya\',this.checked)"> صفحة بهية</label><label style="display:flex;gap:6px;cursor:pointer"><input type="checkbox" '+(ctSel.fb.ganna?'checked':'')+' onchange="ctTogglePage(\'fb\',\'ganna\',this.checked)"> صفحة جنه</label></div></div><div class="acc-sub"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:13px;color:#fff">اكونت 2 - اكونت انستجرام</b><label style="display:flex;gap:6px;font-size:12px;font-weight:800;cursor:pointer;color:#fff"><input type="checkbox" '+(ctSel.igAll?'checked':'')+' onchange="ctToggleIg(this.checked)"> ✅ تحديد الكل بتاع الاكونت ده</label></div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#fff"><label style="display:flex;gap:6px;cursor:pointer"><input type="checkbox" '+(ctSel.ig.angham?'checked':'')+' onchange="ctTogglePage(\'ig\',\'angham\',this.checked)"> انستجرام انغام</label></div></div><button onclick="ctSave()" style="width:100%;margin-top:14px;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:14px;border-radius:99px;font-weight:900;cursor:pointer;font-size:15px;box-shadow:0 15px 30px rgba(16,185,129,.5)">💾 حفظ القالب</button></div><div style="background:#fff;border-radius:22px;padding:14px;margin-top:12px"><b style="font-size:14px">القوالب المحفوظة</b>'+list+'</div><div style="background:#fef3c7;border-radius:16px;padding:12px;margin-top:12px;font-size:12px;line-height:1.9"><b>الفرق ببساطة:</b><br>📢 MARKETING بيظهر في Broadcasting بس • 🛠️ UTILITY بيظهر في Launch Utility بس<br>📤 Posting Templates دي حاجة تانية خالص، بوست عام، مش رسالة خاص، وموجودة في Social Posting<br>🖼️ Media & Content هو المخزن، Create Template بياخد منه، مش بيرفع جديد</div></div>';}

<script>
/* ===== FARAG - الجزء الاخير: ربط + مشتركين + كومنتات + ارسال + سجل + Utility ===== */
if(typeof DB==='undefined'){window.DB={get:function(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v));}};}
/* --- بيانات مشتركة --- */
function faragPages(){return DB.get('farag_pages',[{name:'انغام',type:'Facebook',status:'Connected',account:'facebook'},{name:'بهية',type:'Instagram',status:'Connected',account:'instagram'},{name:'جنه',type:'Facebook',status:'Connected',account:'facebook'}]);}
function faragSubs(){let s=DB.get('farag_subs',[]);if(!s.length){s=[{id:123,name:'انغام',page:'انغام',label:'VIP',status:'Replied',src:'قديم - من الرسايل'},{id:124,name:'بهية',page:'بهية',label:'New',status:'Replied',src:'بوت'},{id:125,name:'جنه',page:'جنه',label:'VIP',status:'Messaged',src:'قديم - مردش'}];DB.set('farag_subs',s);}return s;}
function faragLabels(){let l=DB.get('farag_labels',['VIP','New','قديم','مردش','Imported','مهتم']);return l;}
function faragTemplates(){return DB.get('farag_tpl',[]);}
function accHTML(sel,fn){return '<div style="background:#14132a;border:1px solid #10b981;border-radius:18px;padding:12px;margin-top:10px"><label style="display:flex;gap:8px;color:#fff;font-weight:900;font-size:12px;cursor:pointer"><input type="checkbox" '+(sel.all?'checked':'')+' onchange="'+fn+'ToggleAll(this.checked)"> ✅ تحديد الكل - كل الاكونتات وكل الصفحات</label><div style="background:#0f0f1f;border:1px solid #2e2d4d;border-radius:14px;padding:10px;margin-top:8px"><b style="color:#fff;font-size:12px">اكونت 1 - فيسبوك</b> <label style="color:#fff;font-size:11px;cursor:pointer;float:left"><input type="checkbox" '+(sel.fbAll?'checked':'')+' onchange="'+fn+'ToggleFb(this.checked)"> ✅ الكل بتاع الاكونت ده</label><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:#fff;font-size:12px"><label><input type="checkbox" '+(sel.fb.angham?'checked':'')+' onchange="'+fn+'TogglePage(\'fb\',\'angham\',this.checked)"> انغام</label><label><input type="checkbox" '+(sel.fb.behiya?'checked':'')+' onchange="'+fn+'TogglePage(\'fb\',\'behiya\',this.checked)"> بهية</label><label><input type="checkbox" '+(sel.fb.ganna?'checked':'')+' onchange="'+fn+'TogglePage(\'fb\',\'ganna\',this.checked)"> جنه</label></div></div><div style="background:#0f0f1f;border:1px solid #2e2d4d;border-radius:14px;padding:10px;margin-top:8px"><b style="color:#fff;font-size:12px">اكونت 2 - انستجرام</b> <label style="color:#fff;font-size:11px;cursor:pointer;float:left"><input type="checkbox" '+(sel.igAll?'checked':'')+' onchange="'+fn+'ToggleIg(this.checked)"> ✅ الكل بتاع الاكونت ده</label><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:#fff;font-size:12px"><label><input type="checkbox" '+(sel.ig.angham?'checked':'')+' onchange="'+fn+'TogglePage(\'ig\',\'angham\',this.checked)"> انستجرام انغام</label></div></div></div>';}
function mkSel(){return {all:true,fbAll:true,igAll:true,fb:{angham:true,behiya:true,ganna:true},ig:{angham:true}};}
function selPages(sel){let p=[];if(sel.fb.angham)p.push('انغام');if(sel.fb.behiya)p.push('بهية');if(sel.fb.ganna)p.push('جنه');if(sel.ig.angham)p.push('انستجرام انغام');return p.length?p:['انغام'];}
function selSync(sel,render){sel.all=sel.fbAll&&sel.igAll;render();}

/* ===== 1. Facebook & Instagram ===== */
let fbMode='all';
function fbConnect(type){let mode=prompt('هتربط ازاي؟ اكتب 1 او 2\n1 = كل الصفحات - اللي موجودة واللي هتعملها بعد كده هتتربط لوحدها\n2 = اختار بايدك - تختار انغام بس مثلا\n\nنصيحتنا: اختار 2 في الاول عشان تتحكم');if(!mode)return;fbMode=mode==='1'?'all':'manual';let name=prompt(type==='Facebook'?'اسم الصفحة اللي هتربطها - مثال: انغام':'اسم اكونت الانستجرام - مثال: انستجرام انغام');if(!name||!name.trim())return;if(type==='Instagram'&&!confirm('انستجرام لازم يكون مربوط بصفحة فيسبوك الاول - هل هو مربوط؟')){alert('اربط الانستجرام بصفحة فيسبوك الاول، وبعدين ارجع اربطه هنا');return;}let token='PAGE_TOKEN_'+Date.now()+'_FARAG';let toks=DB.get('farag_tokens',[]);toks.unshift({page:name.trim(),type:type,token:token,time:new Date().toLocaleString('ar-EG')});DB.set('farag_tokens',toks);let pages=faragPages();if(!pages.find(function(x){return x.name===name.trim();}))pages.unshift({name:name.trim(),type:type,status:'Connected',account:type==='Facebook'?'facebook':'instagram',mode:fbMode});DB.set('farag_pages',pages);fbSyncOld(name.trim());alert('✅ اتربطت: '+name+' - التوكن اتخزن في Token Checker - mode: '+(fbMode==='all'?'كل الصفحات':'اختار بايدك'));renderFB();}
function fbSyncOld(page){let subs=faragSubs();let olds=[{name:'عميل قديم 1 - رد',status:'Replied',label:'قديم'},{name:'عميل قديم 2 - مردش',status:'Messaged',label:'مردش'},{name:'عميل قديم 3 - انت مردتش',status:'NotReplied',label:'قديم'}];let added=0;olds.forEach(function(o){if(!subs.find(function(x){return x.name===o.name&&x.page===page;})){subs.unshift({id:1000+Math.floor(Math.random()*9000),name:o.name,page:page,label:o.label,status:o.status,src:'سحب تلقائي - رسايل قديمة'});added++;}});DB.set('farag_subs',subs);if(added)alert('🔄 سحب تلقائي: جبت '+added+' مشترك من الرسايل القديمة بتاعة '+page+' - رد ومردش - بقوا في Subscriber Manager');}
function fbDisconnect(name){DB.set('farag_pages',faragPages().filter(function(x){return x.name!==name;}));DB.set('farag_tokens',DB.get('farag_tokens',[]).filter(function(x){return x.page!==name;}));renderFB();}
function renderFB(){let pages=faragPages();let toks=DB.get('farag_tokens',[]);let rows=pages.map(function(x){return '<tr style="border-bottom:1px solid #eee"><td style="padding:12px;font-weight:800">'+x.name+'</td><td style="padding:12px">'+x.type+' • '+(x.mode==='all'?'كل الصفحات':'اختار بايدك')+'</td><td style="padding:12px"><span style="background:#dcfce7;color:#166534;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:900">● Connected</span></td><td style="padding:12px"><button onclick="fbSyncOld(\''+x.name+'\')" style="background:#f1f5f9;border:none;padding:7px 12px;border-radius:99px;font-weight:800;cursor:pointer">🔄 سحب رسايل قديمة</button> <button onclick="fbDisconnect(\''+x.name+'\')" style="background:#fee2e2;color:#991b1b;border:none;padding:7px 12px;border-radius:99px;font-weight:800;cursor:pointer">فصل</button></td></tr>';}).join('');document.getElementById('app').innerHTML='<div style="perspective:1200px"><div style="background:linear-gradient(135deg,#0a0a1a,#1e1b4b 40%,#1877f2 70%,#0ea5e9);border-radius:28px;padding:22px;color:#fff"><h2 style="margin:0;font-weight:900;font-size:22px">Facebook & Instagram - FARAG.com</h2><p style="font-size:12px;line-height:1.9;margin:8px 0 0">اهم صفحة • الربط = Connect → اختار الصفحات → التوكن يتخزن → تظهر Connected<br>عندك '+pages.length+' صفحة مربوطة • '+toks.length+' توكن متخزن في Token Checker</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button onclick="fbConnect(\'Facebook\')" style="background:#fff;color:#1877f2;border:none;padding:12px 18px;border-radius:99px;font-weight:900;cursor:pointer">+ Connect Page</button><button onclick="fbConnect(\'Instagram\')" style="background:#e1306c;color:#fff;border:none;padding:12px 18px;border-radius:99px;font-weight:900;cursor:pointer">+ Connect Instagram</button></div></div><div style="background:#fff;border-radius:22px;padding:14px;margin-top:12px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:520px"><tr style="text-align:right;color:#888;font-size:12px"><th style="padding:10px">PAGE</th><th>TYPE</th><th>STATUS</th><th>اجراء</th></tr>'+rows+'</table></div><div style="background:#fef3c7;border-radius:16px;padding:12px;margin-top:12px;font-size:12px;line-height:1.9"><b>الربط الحقيقي لما يتعمل بعدين:</b> هتدوس Connect، هيفتح فيسبوك، هيقولك كل الصفحات ولا اختار بايدك؟ تختار، فيسبوك يدينا Page Access Token، يتخزن هنا، والصفحة تظهر Connected. انستجرام لازم يكون مربوط بصفحة فيسبوك الاول. دلوقتي بنحاكي نفس الخطوات دي عشان الدنيا تشتغل وتتحفظ.<br><b>السحب التلقائي:</b> اول ما تربط صفحة، كل رسايلها القديمة - رد ومردش وانت مردتش - بتبقى مشتركين تلقائي في Subscriber Manager.</div></div>';}

/* ===== 2. Subscriber Manager ===== */
let subSearch='',subLabel='الكل',subStatus='الكل';let subSel=mkSel();
function subToggleAll(c){subSel.all=c;subSel.fbAll=c;subSel.igAll=c;subSel.fb.angham=c;subSel.fb.behiya=c;subSel.fb.ganna=c;subSel.ig.angham=c;renderSub();}
function subToggleFb(c){subSel.fbAll=c;subSel.fb.angham=c;subSel.fb.behiya=c;subSel.fb.ganna=c;subSel.all=subSel.fbAll&&subSel.igAll;renderSub();}
function subToggleIg(c){subSel.igAll=c;subSel.ig.angham=c;subSel.all=subSel.fbAll&&subSel.igAll;renderSub();}
function subTogglePage(g,k,c){subSel[g][k]=c;if(g==='fb')subSel.fbAll=subSel.fb.angham&&subSel.fb.behiya&&subSel.fb.ganna;if(g==='ig')subSel.igAll=subSel.ig.angham;subSel.all=subSel.fbAll&&subSel.igAll;renderSub();}
function subAdd(){let n=prompt('اسم المشترك');if(!n)return;let p=prompt('الصفحة - انغام / بهية / جنه');let l=prompt('ال Label - مثال: VIP / New / مهتم\nال Labels الموجودة: '+faragLabels().join(' + '));let s=faragSubs();s.unshift({id:1000+Math.floor(Math.random()*9000),name:n,page:p||'انغام',label:l||'New',status:'Replied',src:'اضافة يدوية'});DB.set('farag_subs',s);renderSub();}
function subAddLabel(){let n=prompt('اسم Label جديد - مثال: اشترى / سأل ومكملش / من رمضان');if(!n)return;let l=faragLabels();if(!l.includes(n))l.push(n);DB.set('farag_labels',l);renderSub();}
function subImport(){let mode=prompt('هتستورد ازاي؟ اكتب 1 او 2\n1 = انسخ وتلزق IDs - الصقهم هنا\n2 = اكتب اسماء - كل اسم في سطر');if(!mode)return;let txt=prompt('الصق هنا IDs او الاسماء - كل واحد في سطر');if(!txt)return;let p=prompt('هتوزعهم على انهي صفحة؟ انغام / بهية / جنه');let l=prompt('هتحطلهم Label ايه؟ مثال: Imported / قديم / VIP');let lines=txt.split('\n').filter(function(x){return x.trim();});let s=faragSubs();lines.forEach(function(line){s.unshift({id:line.trim().substring(0,12),name:'مستورد: '+line.trim(),page:p||'انغام',label:l||'Imported',status:'Imported',src:'استيراد يدوي'});});DB.set('farag_subs',s);alert('✅ استوردت '+lines.length+' مشترك - صفحة: '+(p||'انغام')+' - Label: '+(l||'Imported'));renderSub();}

uled</option></select><select onchange="jhType=this.value;renderJH()" style="padding:11px;border:1px solid #ddd;border-radius:14px;font-weight:800"><option>الكل</option><option>UTILITY</option><option>MARKETING</option></select></div><div style="background:#fff;border-radius:22px;padding:14px;margin-top:12px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:720px"><tr style="color:#888;font-size:11px;text-align:right"><th style="padding:10px">CAMPAIGN</th><th>PAGE</th><th>STATUS</th><th>SCHEDULE</th><th>PROGRESS</th><th>SENT</th><th>ERRORS</th><th>COMPLETED AT</th></tr>'+rows+'</table></div></div>';}
