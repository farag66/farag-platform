<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farag - Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{background:#070b1f;background:radial-gradient(600px 300px at 80% 0%,#1a2456 0%,transparent 60%),linear-gradient(180deg,#070b1f,#0a0f2a);font-family:Inter,system-ui;margin:0;min-height:100vh;color:#fff;overflow-x:hidden}
.sidebar-wrap{position:relative;flex-shrink:0;z-index:50}
.sidebar{background:#0a0f2a;border-left:1px solid rgba(255,255,255,.08);transition:.4s cubic-bezier(.4,0,.2,1);width:290px;height:100vh;position:sticky;top:0;overflow-y:auto;overflow-x:hidden}
.sidebar.collapsed{width:72px}
.sidebar.collapsed .hide-text{display:none!important}
.sidebar.collapsed .side{justify-content:center;padding:10px 6px}
.sidebar.collapsed .brand-sub{display:none}
.sidebar-toggle{position:absolute;top:108px;right:-19px;left:auto;width:38px;height:38px;border-radius:50%;border:2px solid #a78bfa;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(124,58,237,.6);z-index:60;transition:.3s}
.sidebar-toggle:hover{transform:scale(1.12)}
.stat{background:linear-gradient(180deg,#11173a,#0d1230);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;text-align:center;transition:.35s}
.stat:hover{transform:translateY(-5px);box-shadow:0 18px 35px rgba(99,102,241,.45)}
.side{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:13px;color:#cbd5e1;cursor:pointer;white-space:nowrap}
.side:hover{background:rgba(255,255,255,.07);color:#fff}
.side.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.5)}
.ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 6px 14px var(--glow)}
.grid-ico{background:linear-gradient(180deg,#121a3f,#0d1230);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;transition:.35s}
.grid-ico:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 35px rgba(99,102,241,.5)}
.card{background:#fff;color:#0f172a;border-radius:20px;padding:18px}
.input{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:11px 12px;font-size:14px;outline:none;background:#fff;color:#0f172a}
.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;padding:12px;border-radius:12px;font-weight:800;border:none;cursor:pointer}
.btn-blue{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;padding:12px;border-radius:12px;font-weight:800;border:none;cursor:pointer;width:100%}
.badge{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:800}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:none}
.backdrop.show{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.icons-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
/* ===== الرسومات - أتقل وأتقل وأتقل - ULTRA 12D ===== */
.chart-ultra{background:linear-gradient(180deg,#ffffff 0%,#f1f5ff 55%,#e8edff 100%);border-radius:24px;padding:18px;color:#0f172a;position:relative;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.4),0 10px 25px rgba(37,99,235,.18),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(37,99,235,.12),0 0 0 1px rgba(255,255,255,.7);transition:.4s}
.chart-ultra:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 35px 70px rgba(37,99,235,.35),0 18px 35px rgba(0,0,0,.35),inset 0 1px 0 #fff}
.chart-ultra::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#2563eb,#22c55e,#f59e0b,#ec4899,#7c3aed);box-shadow:0 2px 12px rgba(37,99,235,.5)}
.chart-ultra::after{content:'';position:absolute;top:18px;left:18px;width:90px;height:50px;background:radial-gradient(ellipse,rgba(255,255,255,.9),transparent 70%);filter:blur(8px);pointer-events:none}
.donut-ultra{width:172px;height:172px;border-radius:50%;margin:14px auto 0;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 24px 45px rgba(34,197,94,.4),0 8px 18px rgba(0,0,0,.25),inset 0 -12px 22px rgba(0,0,0,.25),inset 0 10px 18px rgba(255,255,255,.8),inset 0 0 0 3px rgba(255,255,255,.35)}
.donut-ultra::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(34,197,94,.25);box-shadow:0 0 22px rgba(34,197,94,.25)}
.donut-ultra::after{content:'';position:absolute;top:12px;left:22px;width:62px;height:26px;background:rgba(255,255,255,.75);border-radius:99px;filter:blur(7px);transform:rotate(-20deg)}
.donut-in-ultra{width:106px;height:106px;background:radial-gradient(circle at 32% 28%,#ffffff 0%,#eef2ff 55%,#dbeafe 100%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0f172a;box-shadow:inset 0 6px 16px rgba(0,0,0,.14),inset 0 -4px 10px rgba(255,255,255,.9),0 10px 20px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.8);position:relative;z-index:2}
.pulse-dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{r:7;opacity:1}50%{r:11;opacity:.55}}
.bar-ultra{border-radius:14px 14px 5px 5px;flex:1;position:relative;box-shadow:inset 0 6px 10px rgba(255,255,255,.7),inset 0 -10px 14px rgba(0,0,0,.22),inset -6px 0 10px rgba(0,0,0,.12),0 16px 24px rgba(37,99,235,.32);transition:.35s;overflow:hidden}
.bar-ultra::before{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.65),transparent);border-radius:14px 14px 0 0}
.bar-ultra::after{content:'';position:absolute;top:6px;left:8px;right:8px;height:10px;background:rgba(255,255,255,.6);border-radius:99px;filter:blur(1px)}
.bar-ultra:hover{transform:translateY(-6px) scale(1.03);filter:brightness(1.12);box-shadow:inset 0 6px 10px rgba(255,255,255,.8),0 22px 32px rgba(37,99,235,.45)}
@media(max-width:900px){
.stats-grid{grid-template-columns:repeat(3,1fr)}
.icons-grid{grid-template-columns:repeat(3,1fr)}
.charts-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
.sidebar-wrap{position:fixed;right:0;top:0;height:100vh;transform:translateX(105%);transition:.4s;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.sidebar-wrap.open{transform:translateX(0)}
.sidebar{width:290px!important}
.sidebar.collapsed{width:290px!important}
.sidebar.collapsed .hide-text{display:flex!important}
.sidebar.collapsed .side{justify-content:space-between;padding:10px 12px}
.sidebar.collapsed .brand-sub{display:block!important}
.sidebar-toggle{right:-19px;top:108px}
.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.icons-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.stat{padding:10px 6px}
.stat div:last-child{font-size:16px!important}
}
</style>
</head>
<body>
<div style="display:flex;flex-direction:row-reverse">
<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>
<div class="sidebar-wrap" id="sidebarWrap">
<div class="sidebar" id="sidebar">
<div style="text-align:center;padding:14px 0 6px"><div style="display:flex;align-items:center;justify-content:center;gap:8px"><div style="width:38px;height:38px;background:linear-gradient(135deg,#4f46e5,#a78bfa);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:0 8px 20px rgba(124,58,237,.6)">F</div><div class="hide-text" style="text-align:right"><div style="font-weight:900;font-size:22px;line-height:1">FARAG<span style="color:#a78bfa">.com</span></div><div class="brand-sub" style="font-size:10px;color:#94a3b8">منصة فرج - Farag Platform</div></div></div></div>
<div id="menu" style="padding:8px 12px 0"></div>
<button onclick="if(confirm('تصفر كل حاجة؟')){localStorage.clear();location.reload()}" class="hide-text" style="margin:16px 12px 0;width:calc(100% - 24px);background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;padding:10px;border:none;border-radius:12px;font-weight:800;cursor:pointer">Reset / تصفير الكل</button>
</div>
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="فتح / قفل القايمة">☰</button>
</div>

<div style="flex:1;min-width:0;padding:16px;max-width:1150px;margin:0 auto;padding-bottom:60px;width:100%">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<div><h1 style="font-size:26px;font-weight:900;margin:0">Dashboard - فرج</h1><p style="color:#94a3b8;font-size:11px;margin:4px 0 0">Farag - Cloud + Glow + Float + STATE</p></div>
<button onclick="go('broadcasting',null)" style="background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;padding:8px 16px;border-radius:12px;font-weight:800;cursor:pointer;white-space:nowrap">Launch 🚀</button>
</div>
<div id="app"></div>
</div>
</div>

<script>
let DB={get:function(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function toggleSidebar(){
let sb=document.getElementById('sidebar');
let wrap=document.getElementById('sidebarWrap');
let back=document.getElementById('backdrop');
if(window.innerWidth<=768){
let open=wrap.classList.toggle('open');
back.classList.toggle('show',open);
}else{
let col=sb.classList.toggle('collapsed');
try{localStorage.setItem('farag_sidebar',col?'collapsed':'open')}catch(e){}
}
}
try{if(localStorage.getItem('farag_sidebar')==='collapsed' && window.innerWidth>768){document.getElementById('sidebar').classList.add('collapsed')}}catch(e){}
let MENU=[
{t:'Dashboard',p:'dashboard',i:'📊',c:'#2563eb',c2:'#60a5fa',g:'rgba(37,99,235,.5)'},
{t:'Facebook & Instagram',p:'facebook',i:'🔗',c:'#0284c7',c2:'#38bdf8',g:'rgba(2,132,199,.5)'},
{t:'Comment growth tools',p:'comment',i:'💬',c:'#f59e0b',c2:'#fbbf24',g:'rgba(245,158,11,.5)'},
{t:'Subscriber Manager',p:'subscriber',i:'🫂',c:'#16a34a',c2:'#4ade80',g:'rgba(22,163,74,.5)'},
{t:'Broadcasting',p:'broadcasting',i:'📣',c:'#ec4899',c2:'#f472b6',g:'rgba(236,72,153,.5)'},
{t:'Broadcast Job History',p:'history',i:'🕘',c:'#64748b',c2:'#94a3b8',g:'rgba(100,116,139,.5)'},
{t:'Launch Utility',p:'utility',i:'🚀',c:'#f97316',c2:'#fb923c',g:'rgba(249,115,22,.5)'},
{t:'Social Posting',p:'posting',i:'📝',c:'#9333ea',c2:'#c084fc',g:'rgba(147,51,234,.5)'},
{t:'Create Template',p:'template',i:'🎨',c:'#eab308',c2:'#facc15',g:'rgba(234,179,8,.5)'},
{t:'Media & Content',p:'media',i:'🎬',c:'#06b6d4',c2:'#22d3ee',g:'rgba(6,182,212,.5)'},
{t:'Bot manager',p:'bot',i:'🤖',c:'#16a34a',c2:'#4ade80',g:'rgba(22,163,74,.5)'},
{t:'AI Sales Agent',p:'ai',i:'✦',c:'#ec4899',c2:'#f472b6',g:'rgba(236,72,153,.5)'},
{t:'Comment Analytics',p:'analytics',i:'📈',c:'#22c55e',c2:'#4ade80',g:'rgba(34,197,94,.5)'},
{t:'Page Restrictions',p:'restrictions',i:'🛡️',c:'#f97316',c2:'#fb923c',g:'rgba(249,115,22,.5)'},
{t:'Token Checker',p:'token',i:'🔑',c:'#eab308',c2:'#facc15',g:'rgba(234,179,8,.5)'},
{t:'API channels',p:'api',i:'🔌',c:'#0284c7',c2:'#38bdf8',g:'rgba(2,132,199,.5)'},
{t:'Migrate',p:'migrate',i:'↔️',c:'#7c3aed',c2:'#a78bfa',g:'rgba(124,58,237,.5)'},
{t:'Blocked Pages',p:'blocked',i:'🚫',c:'#ef4444',c2:'#f87171',g:'rgba(239,68,68,.5)'},
{t:'Payment',p:'payment',i:'💳',c:'#16a34a',c2:'#4ade80',g:'rgba(22,163,74,.5)'},
];
function renderMenu(active){
document.getElementById('menu').innerHTML=MENU.map(function(m){return '<div class="side '+(active===m.p?'active':'')+'" onclick="go(\''+m.p+'\',this)"><span class="hide-text">'+m.t+'</span><span class="ico" style="--c:'+m.c+';--c2:'+m.c2+';--glow:'+m.g+'">'+m.i+'</span></div>'}).join('');
}
function go(p,el){
renderMenu(p);
if(window.innerWidth<=768){document.getElementById('sidebarWrap').classList.remove('open');document.getElementById('backdrop').classList.remove('show')}
if(p==='dashboard') renderDashboard();
else if(p==='template') renderTemplate();
else if(p==='broadcasting') renderBroadcast('MARKETING');
else if(p==='utility') renderBroadcast('UTILITY');
else if(p==='posting') renderPosting();
else if(p==='media') renderMedia();
else if(p==='subscriber') renderSimple('🫂 Subscriber Manager','بتشوف هنبعت لمين - 1,592,739 مشترك - 75,177 Subscribers');
else if(p==='history') renderSimple('🕘 Broadcast Job History','بنشوف الحملة حصل فيها ايه - وصفات 15/15 Done - جونام 1/1 Done');
else if(p==='facebook') renderSimple('🔗 Facebook & Instagram','177 صفحة مربوطة - 177 Enabled');
else if(p==='comment') renderSimple('💬 Comment growth tools','1,141 تعليق النهاردة - 97.5% اترد عليه');
else if(p==='bot') renderSimple('🤖 Bot manager','البوت شغال - بيرد على التعليقات والرسايل');
else if(p==='ai') renderSimple('✦ AI Sales Agent','وكيل المبيعات - جاهز يبيع بدالك');
else if(p==='analytics') renderSimple('📈 Comment Analytics','تحليل التعليقات');
else if(p==='restrictions') renderSimple('🛡️ Page Restrictions','مفيش صفحات محظورة');
else if(p==='token') renderSimple('🔑 Token Checker','كل التوكنات سليمة - 177/177');
else if(p==='api') renderSimple('🔌 API channels','API مربوط - WhatsApp + Messenger');
else if(p==='migrate') renderSimple('↔️ Migrate','1,109,765 جاهزين يتحولوا لـ Subscribers');
else if(p==='blocked') renderSimple('🚫 Blocked Pages','0 صفحات محظورة');
else if(p==='payment') renderSimple('💳 Payment','خطة فرج - الدفع شغال');
else renderDashboard();
window.scrollTo(0,0);
}
function renderSimple(t,s){
document.getElementById('app').innerHTML='<div style="background:linear-gradient(180deg,#11173a,#0d1230);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:36px;text-align:center;margin-top:16px"><h2 style="font-weight:900;font-size:24px;margin:0">'+t+'</h2><p style="color:#94a3b8;margin-top:10px">'+s+'</p><button class="btn" style="max-width:250px;margin:16px auto 0" onclick="go(\'dashboard\')">Back to Dashboard</button></div>';
}
function renderDashboard(){
let icons=MENU.map(function(m){return '<div class="grid-ico" onclick="go(\''+m.p+'\')"><div class="ico" style="--c:'+m.c+';--c2:'+m.c2+';--glow:'+m.g+';width:48px;height:48px;font-size:22px;margin:0 auto">'+m.i+'</div><div style="font-size:12px;font-weight:700;margin-top:10px;line-height:1.3">'+m.t+'</div></div>'}).join('');
document.getElementById('app').innerHTML=`
<div class="stats-grid">
<div class="stat"><div style="font-size:11px;color:#94a3b8">Total Jobs</div><div style="font-size:20px;font-weight:900;margin-top:4px">1060</div></div>
<div class="stat"><div style="font-size:11px;color:#94a3b8">Completed</div><div style="font-size:20px;font-weight:900;margin-top:4px">1013</div></div>
<div class="stat"><div style="font-size:11px;color:#94a3b8">Pending</div><div style="font-size:20px;font-weight:900;margin-top:4px">19</div></div>
<div class="stat"><div style="font-size:11px;color:#94a3b8">Scheduled</div><div style="font-size:20px;font-weight:900;margin-top:4px">28</div></div>
<div class="stat"><div style="font-size:11px;color:#94a3b8">Total Sent</div><div style="font-size:20px;font-weight:900;margin-top:4px">1,101,208</div></div>
<div class="stat"><div style="font-size:11px;color:#94a3b8">Recipients</div><div style="font-size:20px;font-weight:900;margin-top:4px">1,423,473</div></div>
</div>
<div style="background:linear-gradient(180deg,#11173a,#0d1230);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-top:14px;text-align:right">
<h2 style="font-weight:900;font-size:20px;margin:0">المعادلة - منصة فرج</h2>
<div style="color:#e2e8f0;font-size:14px;line-height:2;margin-top:8px"><div>Create Template = بتعمل القالب</div><div>Subscriber Manager = بتشوف هنبعت لمين</div><div>Launch Utility / Broadcasting = بتبعت الحملة</div><div>Broadcast Job History = بنشوف الحملة حصل فيها ايه</div></div>
</div>
<div style="background:linear-gradient(180deg,#11173a,#0d1230);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-top:14px">
<h2 style="font-weight:900;font-size:18px;margin:0;text-align:right">كل الايقونات</h2>
<div class="icons-grid">${icons}</div>
</div>

<!-- ===== الرسومات - ULTRA أتقل وأتقل ===== -->
<div class="charts-grid">
<div class="chart-ultra"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:15px">● 7-Day Activity - Line Chart</b><span style="font-size:10px;background:#eff6ff;color:#2563eb;padding:4px 8px;border-radius:99px;font-weight:800;box-shadow:0 4px 10px rgba(37,99,235,.2)">LIVE 🔴</span></div>
<svg viewBox="0 0 600 230" style="width:100%;height:195px;margin-top:8px;filter:drop-shadow(0 14px 18px rgba(37,99,235,.22))">
<defs><linearGradient id="lgBlue2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.42"/><stop offset="55%" stop-color="#60a5fa" stop-opacity="0.14"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient><linearGradient id="lgGreen2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.32"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></linearGradient><filter id="glowB2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowG2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

<circle cx="600" cy="110" r="3" fill="#22c55e"/>
<circle cx="510" cy="175" r="6" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<circle cx="340" cy="175" r="5" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
</svg><div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b;font-weight:800"><span>🟢 Comments</span><span>🔵 Broadcast</span></div></div>

function renderTemplate(){
let list=DB.get('farag_tpl',[{id:1,name:'قالب الترحيب',title:'صلي على النبي',subtitle:'واذكر الله',type:'UTILITY'}]);
let html='<div class="card" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0">Create Template - المخزن الرئيسي - فرج</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><input id="t-name" class="input" placeholder="Template name"><select id="t-type" class="input"><option>UTILITY - خدمية</option><option>MARKETING - دعائية</option></select></div><input id="t-title" class="input" style="margin-top:10px" placeholder="Title"><input id="t-sub" class="input" style="margin-top:10px" placeholder="Sub-title"><button class="btn" style="margin-top:12px" onclick="saveTpl()">💾 حفظ القالب</button></div><div class="card" style="margin-top:12px"><b>القوالب المحفوظة ('+list.length+')</b><div style="margin-top:10px">';
list.forEach(function(t){html+='<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:8px"><div><b>'+t.name+'</b> <span class="badge" style="background:#dbeafe;color:#1d4ed8">'+t.type+'</span><div style="font-size:12px;color:#64748b">'+(t.title||'')+' - '+(t.subtitle||'')+'</div></div><button onclick="delTpl('+t.id+')" style="background:none;border:none;color:#ef4444;font-weight:800;cursor:pointer">🗑 Delete</button></div>'});
html+='</div></div>';
document.getElementById('app').innerHTML=html;
}
function saveTpl(){let n=document.getElementById('t-name').value.trim();if(!n){alert('اكتب اسم القالب');return;}let a=DB.get('farag_tpl',[]);a.unshift({id:Date.now(),name:n,title:document.getElementById('t-title').value,subtitle:document.getElementById('t-sub').value,type:document.getElementById('t-type').value.split(' - ')[0]});DB.set('farag_tpl',a);alert('✅ تم حفظ القالب '+n);renderTemplate();}
function delTpl(id){if(!confirm('تمسح؟'))return;DB.set('farag_tpl',DB.get('farag_tpl',[]).filter(function(x){return x.id!==id}));renderTemplate();}
function renderBroadcast(type){
let list=DB.get('farag_tpl',[]);
let f=list.filter(function(t){return (t.type||'UTILITY')===type});
document.getElementById('app').innerHTML='<div class="card" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0">'+(type==='MARKETING'?'Broadcasting - دعائية 📡 - فرج':'Launch Utility - خدمية ⚡ - فرج')+'</h2><label style="font-size:12px;font-weight:800;display:block;margin-top:12px">اختار الصفحة</label><select class="input" style="margin-top:6px"><option>صفحة انغام</option><option>صفحة بهية</option><option>صفحة جنه</option></select><label style="font-size:12px;font-weight:800;display:block;margin-top:12px">اختار القالب - بيظهرلك '+type+' بس</label><select class="input" style="margin-top:6px"><option>'+(f.length?f.map(function(t){return t.name}).join(' - '):'مفيش قوالب '+type+' - روح Create Template واعمل واحد')+'</option></select><button class="btn-blue" style="margin-top:14px" onclick="alert(\'🚀 تم إطلاق الحملة - '+type+'\')">Launch 🚀</button></div><div class="card" style="margin-top:12px;font-size:13px;color:#475569">'+(type==='MARKETING'?'⚠️ MARKETING: مينفعش تبعت غير للي كلمك اخر 24 ساعة':'✅ UTILITY: مسموح تبعت حتى لو العميل مردش بقاله فترة')+'</div>';
}
