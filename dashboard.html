<style>
*{box-sizing:border-box}
body{background:#02010f;background:radial-gradient(900px 450px at 10% 0%,rgba(124,58,237,.62) 0%,transparent 60%),radial-gradient(800px 450px at 95% 10%,rgba(37,99,235,.62) 0%,transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(34,197,94,.38) 0%,transparent 60%),radial-gradient(500px 300px at 50% 50%,rgba(245,158,11,.18) 0%,transparent 60%),linear-gradient(180deg,#02010f,#070b1f 40%,#02010f);font-family:Inter,system-ui;margin:0;min-height:100vh;color:#fff;overflow-x:hidden;perspective:1400px}

@keyframes orbPro{0%,100%{transform:scale(1) rotate(0deg);box-shadow:0 0 28px rgba(167,139,250,.9),0 0 70px rgba(124,58,237,.6)}50%{transform:scale(1.12) rotate(8deg);box-shadow:0 0 42px rgba(167,139,250,1),0 0 100px rgba(124,58,237,.8)}}

@keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}25%{transform:translateY(-6px) rotate(-4deg) scale(1.08)}50%{transform:translateY(-10px) rotate(3deg) scale(1.12)}75%{transform:translateY(-4px) rotate(-2deg) scale(1.06)}}

.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:linear-gradient(145deg,var(--c2),var(--c) 60%,var(--c));box-shadow:0 8px 16px var(--glow),inset 0 2px 4px rgba(255,255,255,.6);transition:.3s;animation:iconFloat 3.8s ease-in-out infinite}

.media-btn{flex:1;background:#fff;border:2px dashed #c7d2fe;color:#4338ca;padding:11px;border-radius:14px;font-weight:900;cursor:pointer;font-size:13px}
.publish-btn{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;padding:8px 16px;border-radius:99px;font-weight:900;cursor:pointer;white-space:nowrap;font-size:12px}
.input{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:12px;font-size:14px;outline:none;background:#fff;color:#0f172a;position:relative;z-index:2}
.btn{width:100%;background:linear-gradient(145deg,#a78bfa,#7c3aed 55%,#5b21b6);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 12px 22px rgba(124,58,237,.5);position:relative;overflow:hidden}

.btn-blue{background:linear-gradient(145deg,#60a5fa,#2563eb 55%,#1d4ed8);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;width:100%;box-shadow:0 12px 22px rgba(37,99,235,.5);position:relative;overflow:hidden}
.btn-blue::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shinePro 4s ease-in-out infinite;pointer-events:none}
.badge{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:800}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:none}.backdrop.show{display:block}

.glass-panel{background:linear-gradient(145deg,rgba(28,38,88,.92),rgba(13,18,48,.96));border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;box-shadow:0 22px 42px rgba(0,0,0,.42);position:relative;overflow:hidden;animation:aiGlow 3.5s ease-in-out infinite}

.bar-ultra{border-radius:16px 16px 6px 6px;flex:1;position:relative;box-shadow:inset 0 6px 10px rgba(255,255,255,.7);transition:.35s;overflow:hidden;animation:iconFloat 4s ease-in-out infinite}
.bar-ultra::before{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.75),transparent)}

.fab-wa{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#4ade80,#22c55e 55%,#15803d);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 14px 28px rgba(34,197,94,.55);transition:.3s;border:2px solid rgba(255,255,255,.3);overflow:hidden;animation:iconFloat 3.4s ease-in-out infinite;animation-delay:.4s}

function renderComment(){let tools=DB.get('farag_comment_tools',null);if(tools===null){tools=[{id:1,post:'بوست الكورس',kw:'تم',reply:'تم الرد عليك في الخاص يا فندم ❤️',dm:'اهلا بيك، العرض النهارده...',on:true}];DB.set('farag_comment_tools',tools);}let replyTpls=DB.get('farag_reply_tpls',[{id:1,kw:'تم',reply:'تم الرد عليك في الخاص يا فندم ❤️',dm:'اهلا بيك، العرض النهارده...'},{id:2,kw:'السعر',reply:'بعتلك السعر في الخاص ❤️',dm:'السعر النهارده عليه خصم...'},{id:3,kw:'عايز',reply:'تمام يا فندم، بعتلك التفاصيل ❤️',dm:'اهلا بيك، التفاصيل كلها هنا...'}]);let rows=tools.map(function(t){return '<tr><td><b>'+t.post+'</b></td><td><span class="badge" style="background:#fef3c7;color:#92400e">🔑 '+t.kw+'</span></td><td>'+t.reply+'</td><td><span class="badge" style="background:#e0e7ff;color:#3730a3">✉️ '+t.dm+'</span></td><td><div style="display:flex;align-items:center;gap:10px"><div><div class="switch '+(t.on?'':'off')+'" onclick="toggleTool('+t.id+')"></div><div style="font-size:11px;font-weight:900;text-align:center;margin-top:4px;color:'+(t.on?'#16a34a':'#94a3b8')+'">'+(t.on?'ON - شغالة':'OFF - مطفية')+'</div></div><button class="delete-btn" onclick="delTool('+t.id+')">🗑 مسح</button></div></td></tr>'}).join('');let tplRows=replyTpls.map(function(t){return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-top:8px"><div style="flex:1;text-align:right"><b>🔑 '+t.kw+'</b> • <span style="font-size:12px;color:#475569">رد عام: '+t.reply+'</span><div style="font-size:12px;color:#64748b;margin-top:3px">رسالة خاص: '+t.dm+'</div></div><button class="delete-btn" onclick="delReplyTpl('+t.id+')">🗑</button></div>'}).join('');document.getElementById('app').innerHTML='<div class="glass-panel" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0">💬 Comment growth tools - FARAG.com</h2><p style="font-size:13px;color:#94a3b8;margin:6px 0 0">دي اللي بتجيبلك المشتركين - لو حد علق بكلمة، هعمل ايه؟</p></div><div class="card" style="margin-top:12px"><b>📚 قوالب الرد على الكومنتات - جوه Comment growth tools نفسها</b><p style="font-size:12px;color:#64748b;line-height:1.8;margin:8px 0 0">القالب هنا = <b>كلمة + رد عام + رسالة خاص</b></p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px"><input id="reply-kw" class="input" placeholder="الكلمة - مثلا: تم / السعر / عايز"><input id="reply-public" class="input" placeholder="رد عام - اللي كل الناس هتشوفه"><input id="reply-dm" class="input" placeholder="رسالة خاص - اللي هتتبعتله في الخاص"></div><button class="btn" style="margin-top:10px" onclick="saveReplyTpl()">💾 حفظ قالب رد</button><div style="margin-top:10px">'+tplRows+'</div><div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:8px">قالب الارسال في Create Template • قالب النشر في Social Posting • قالب الرد على الكومنت في Comment growth tools</div></div><div class="card" style="margin-top:12px;padding:0;overflow:hidden"><table class="farag-table"><thead><tr><th>POST</th><th>KEYWORD</th><th>REPLY</th><th>DM</th><th>STATUS</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}
function saveReplyTpl(){let kw=(document.getElementById('reply-kw').value||'').trim();let rp=(document.getElementById('reply-public').value||'').trim();let dm=(document.getElementById('reply-dm').value||'').trim();if(!kw){alert('اكتب الكلمة - مثلا: تم');return;}let a=DB.get('farag_reply_tpls',[]);a.unshift({id:Date.now(),kw:kw,reply:rp||'تم الرد عليك في الخاص يا فندم ❤️',dm:dm||'اهلا بيك، العرض النهارده...'});DB.set('farag_reply_tpls',a);alert('✅ اتحفظ قالب الرد: '+kw);renderComment();}

function usePostingTpl(){let sel=document.getElementById('tplSelect');let id=parseInt(sel.value);if(!id){alert('اختار قالب الاول');return;}let t=DB.get('farag_posting_templates',[]).find(function(x){return x.id===id});if(!t){alert('القالب مش موجود');return;}document.getElementById('pt-title').value=t.title;document.getElementById('pt-text').value=t.text;alert('✅ اتحمل القالب: '+t.title);}

function launchBroadcast(type){
let tplSel=document.getElementById('bcTpl');
let tplId=tplSel?parseInt(tplSel.value):null;
let tpl=DB.get('farag_tpl',[]).find(function(x){return x.id===tplId});
if(!tpl){alert('اختار القالب الاول - من Create Template');return;}
let pages=[];if(bcSel.fb.angham)pages.push('انغام');if(bcSel.fb.behiya)pages.push('بهية');if(bcSel.fb.ganna)pages.push('جنه');if(bcSel.ig.angham)pages.push('انستجرام انغام');
if(pages.length===0){alert('اختار صفحة واحدة على الاقل');return;}
let labels=[];if(bcLabels.VIP)labels.push('VIP');if(bcLabels.New)labels.push('New');if(bcLabels.Imported)labels.push('Imported');if(bcLabels.Messaged)labels.push('Messaged');if(bcLabels.Replied)labels.push('Replied');if(bcLabels.NotReplied)labels.push('NotReplied');
let subs=DB.get('farag_subscribers',[]);
let targets=subs.filter(function(s){return pages.includes(s.page)&&labels.includes(s.label);});
let count=targets.length||subs.length;
let jobs=DB.get('farag_jobs',[]);
jobs.unshift({id:Date.now(),tpl:tpl.name,pages:pages.join(' + '),labels:labels.join(' + '),sent:count,total:count,status:'Done',type:type,time:new Date().toLocaleString('ar-EG')});
DB.set('farag_jobs',jobs);
alert('🚀 تم إطلاق الحملة - '+type+' - القالب: '+tpl.name+' - من: '+pages.join(' + ')+' - لـ: '+labels.join(' + ')+' - اتبعت لـ '+count+' واحد - اتسجلت في Broadcast Job History - Total Jobs زاد واحد');
go('history');
}
function renderHistory(){
let jobs=DB.get('farag_jobs',[{id:1,tpl:'قالب العرض',pages:'انغام',labels:'VIP',sent:15,total:15,status:'Done',type:'MARKETING',time:'2026-11-11'}]);
let rows=jobs.map(function(j){return '<tr><td><b>'+j.tpl+'</b><div style="font-size:11px;color:#94a3b8">'+j.time+' • '+j.type+'</div></td><td>'+j.pages+'</td><td>'+j.labels+'</td><td><b>'+j.sent+'/'+j.total+'</b></td><td><span class="badge" style="background:#dcfce7;color:#15803d">● '+j.status+'</span></td></tr>'}).join('');
document.getElementById('app').innerHTML='<div class="card" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0">🕘 Broadcast Job History - FARAG.com</h2><p style="font-size:12px;color:#64748b;margin:8px 0 0">بنشوف الحملة حصل فيها ايه - اتبعتت لكام واحد، ونجحت ولا فشلت</p></div><div class="card" style="margin-top:12px;padding:0;overflow:hidden"><table class="farag-table"><thead><tr><th>القالب</th><th>الصفحات</th><th>Labels</th><th>اتبعت</th><th>STATUS</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
/* ===== Media & Content - مخزن كامل ===== */
let activeFolderId=1;
function renderMedia(){
let folders=DB.get('farag_folders',null);
if(folders===null){folders=[{id:1,name:'عروض رمضان',count:12},{id:2,name:'منتجات انغام',count:8},{id:3,name:'فيديوهات بهية',count:5},{id:4,name:'بوستات',count:6}];DB.set('farag_folders',folders);}
let items=DB.get('farag_media_items',null);
if(items===null){items={1:[{id:11,icon:'🖼️',name:'صورة 1 - عروض رمضان',kind:'صورة'},{id:12,icon:'🎬',name:'فيديو 1 - عروض رمضان',kind:'فيديو'},{id:13,icon:'📝',name:'بوست كامل - عروض رمضان',kind:'بوست'}],2:[{id:21,icon:'🖼️',name:'صورة انغام 1',kind:'صورة'},{id:22,icon:'🎬',name:'فيديو انغام 1',kind:'فيديو'}],3:[{id:31,icon:'🎬',name:'فيديو بهية 1',kind:'فيديو'},{id:32,icon:'🖼️',name:'صورة بهية 1',kind:'صورة'}],4:[{id:41,icon:'📝',name:'بوست العرض - كامل',kind:'بوست'},{id:42,icon:'📝',name:'بوست الترحيب - كامل',kind:'بوست'}]};DB.set('farag_media_items',items);}
if(!items[activeFolderId])activeFolderId=folders[0].id;
let cur=items[activeFolderId]||[];
let curFolder=folders.find(function(f){return f.id===activeFolderId})||folders[0];
let html='<div class="card" style="margin-top:14px"><div style="text-align:center"><h2 style="font-weight:900;font-size:22px;margin:0"><span class="icon-anim" style="display:inline-block">🎬</span> Media & Content - مخزن المنصة كله - FARAG.com</h2><p style="font-size:13px;color:#64748b;margin:8px 0 0;line-height:1.8">مش مجرد مكان بنرمي فيه صور وخلاص. هيبقى مخزن المنصة كله، ومتقسم فولدرات براحتك انت.<br><b style="color:#0f172a">هتخزن فيه 3 حاجات: 1. صور - Images • 2. فيديوهات - Videos • 3. بوستات - Posts</b> - البوست نفسه هيتخزن كامل: نص البوست + الصورة / الفيديو + عنوانه</p></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><input id="newFolder" class="input" style="flex:1" placeholder="اسم فولدر جديد... مثلا: فولدر 4 - فولدر 5 - فولدر 100 - براحتك"><button onclick="addFolder()" style="background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;padding:11px 16px;border-radius:14px;font-weight:900;cursor:pointer;white-space:nowrap">+ فولدر جديد 📂</button></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input id="newMediaName" class="input" style="flex:1" placeholder="اسم صورة / فيديو / بوست جديد..."><select id="newMediaKind" class="input" style="flex:0 0 140px"><option>🖼️ صورة</option><option>🎬 فيديو</option><option>📝 بوست</option></select><button onclick="addMediaItem()" style="background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;padding:11px 16px;border-radius:14px;font-weight:900;cursor:pointer;white-space:nowrap">+ اضافة للمخزن</button></div><div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:6px">انت اللي بتعمل الفولدر، وانت اللي بتسميه، وانت اللي بتحط جواه اللي انت عايزه. مفيش عدد محدد، اعمل براحتك.</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px">';
folders.forEach(function(f){html+='<div class="folder-card '+(f.id===activeFolderId?'active':'')+'" onclick="selectFolder('+f.id+')"><div style="text-align:center"><div class="folder-ico">📂</div><div style="font-weight:900;font-size:13px;margin-top:4px">'+f.name+'</div><div style="font-size:11px;color:#64748b;margin-top:2px">'+(items[f.id]?items[f.id].length:f.count)+' ملف</div></div></div>'});
html+='</div><div style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">📂 جوه الفولدر - '+(curFolder?curFolder.name:'')+'</b><span class="badge" style="background:#e0e7ff;color:#3730a3">'+cur.length+' ملف - صور + فيديوهات + بوستات بتوعه بس، مش متلخبطين</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px">';
cur.forEach(function(it){html+='<div class="media-item"><div style="font-size:28px" class="icon-anim">'+it.icon+'</div><div style="font-size:12px;font-weight:800;margin-top:4px">'+it.name+'</div><div style="font-size:11px;color:#64748b">'+(it.kind||'صورة')+'</div><button class="use-btn" onclick="useMedia(\''+it.name+'\')">✅ استخدام</button><button class="delete-btn" style="margin-top:6px" onclick="delMediaItem('+it.id+')">🗑 مسح</button></div>'});
if(cur.length===0)html+='<div style="grid-column:1/-1;text-align:center;color:#94a3b8;font-size:13px;padding:16px">الفولدر ده فاضي - اضف صورة / فيديو / بوست من فوق 👆</div>';
html+='</div></div><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px;margin-top:14px;font-size:13px;text-align:center;line-height:1.8"><b>لما تجي تعمل قالب، هستخدمهم ازاي؟</b><br>لما تروح تعمل Create Template - قالب ارسال، وتوصل لحتة Image - مش هترفع صورة من جهازك كل مرة، لأ. هيتفتحلك Media & Content، تختار الفولدر، تختار الصورة، وتدوس استخدام.<br>ونفس الكلام في Posting Templates - قالب نشر: هتختار البوست من المخزن، او هتختار الصورة والفيديو من الفولدر، وتكمل. <b>يعني ترفع مرة واحدة، وتستخدم 100 مرة.</b><br><b>Media & Content = مخزن + فولدرات بعدد مفتوح + صور + فيديوهات + بوستات • Posting Templates = بياخد من المخزن ده • Create Template = بياخد الصور من المخزن ده برضه</b></div></div>';
document.getElementById('app').innerHTML=html;
}
function selectFolder(id){activeFolderId=id;renderMedia();}
function useMedia(name){alert('تم اختيار: '+name+' - هيتستخدم في Create Template و Posting - ترفع مرة، تستخدم 100 مرة');go('template');}
function addFolder(){let n=(document.getElementById('newFolder').value||'').trim();if(!n){alert('اكتب اسم الفولدر');return;}let a=DB.get('farag_folders',[]);let nid=Date.now();a.push({id:nid,name:n,count:0});DB.set('farag_folders',a);let items=DB.get('farag_media_items',{});items[nid]=[];DB.set('farag_media_items',items);activeFolderId=nid;alert('اتعمل فولدر: '+n+' - براحتك، مفيش عدد محدد');renderMedia();}
function addMediaItem(){let n=(document.getElementById('newMediaName').value||'').trim();if(!n){alert('اكتب اسم الصورة / الفيديو / البوست');return;}let kind=document.getElementById('newMediaKind').value;let icon=kind.includes('فيديو')?'🎬':kind.includes('بوست')?'📝':'🖼️';let kindTxt=kind.includes('فيديو')?'فيديو':kind.includes('بوست')?'بوست':'صورة';let items=DB.get('farag_media_items',{});if(!items[activeFolderId])items[activeFolderId]=[];items[activeFolderId].push({id:Date.now(),icon:icon,name:n,kind:kindTxt});DB.set('farag_media_items',items);alert('✅ اتضاف للمخزن: '+n);renderMedia();}
function delMediaItem(id){if(!confirm('هتمسح الملف ده من المخزن؟'))return;let items=DB.get('farag_media_items',{});items[activeFolderId]=(items[activeFolderId]||[]).filter(function(x){return x.id!==id});DB.set('farag_media_items',items);renderMedia();}
renderMenu('dashboard');renderDashboard();
</script>
