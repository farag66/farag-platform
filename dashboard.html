<style>
*{box-sizing:border-box}body{background:#eef1f6;font-family:Inter,system-ui;margin:0}
.card12{background:#fff;border-radius:22px;box-shadow:0 4px 20px rgba(15,23,42,.06),0 0 0 1px #f1f5f9;transition:.45s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}

#media-sub{max-height:0;overflow:hidden;transition:.45s}#media-sub.open{max-height:220px}
#media-chevron{transition:.35s}#media-chevron.rot{transform:rotate(180deg)}
.ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;position:relative;transition:.4s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 6px 14px var(--glow)}
.side-item:hover .ico{transform:translateY(-6px) scale(1.18) rotate(-5deg);box-shadow:0 14px 26px var(--glow);animation:f1 1.6s infinite}
@keyframes f1{0%,100%{transform:translateY(-6px) scale(1.18) rotate(-5deg)}50%{transform:translateY(-11px) scale(1.18) rotate(-5deg)}}
.cloud{position:absolute;left:100%;top:50%;transform:translateY(-50%) translateX(4px) scale(.85);background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;font-size:11px;font-weight:800;white-space:nowrap;padding:8px 11px;border-radius:999px;opacity:0;pointer-events:none;transition:.35s;z-index:50;box-shadow:0 10px 24px var(--glow)}
.side-item:hover .ico .cloud{opacity:1;transform:translateY(-50%) translateX(14px) scale(1)}
.icon-cloud{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;transition:.4s;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 6px 14px var(--glow);cursor:pointer}
.icon-cloud:hover{transform:translateY(-6px) scale(1.18) rotate(-5deg);box-shadow:0 14px 26px var(--glow);animation:f1 1.6s infinite}
.icon-cloud .cloud{left:50%;bottom:calc(100% + 10px);top:auto;transform:translateX(-50%) translateY(8px)}
.icon-cloud:hover .cloud{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.top-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;transition:.4s;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 6px 14px var(--glow)}
.top-ico:hover{transform:translateY(-5px) scale(1.15) rotate(-5deg);animation:f1 1.6s infinite}
.top-ico .cloud{left:50%;top:calc(100% + 10px);transform:translateX(-50%) translateY(-6px)}
.top-ico:hover .cloud{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.inner-tab{padding:9px 16px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;border:1px solid #e2e8f0;background:#fff;color:#475569}
.inner-tab.active{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 8px 18px var(--glow)}
.bc-pill{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#475569;white-space:nowrap}

.bc-btn{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 4px 10px var(--glow);position:relative}

.bc-btn:hover .cloud{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.mini-btn{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;box-shadow:0 4px 10px var(--glow);position:relative}
.mini-btn:hover{transform:translateY(-3px) scale(1.2) rotate(-5deg)}

.mini-btn:hover .cloud{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.media-item{border-radius:16px;overflow:hidden;position:relative;cursor:pointer;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);aspect-ratio:1}
.media-item:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 20px 36px var(--glow)}
.media-item img{width:100%;height:100%;object-fit:cover}
.media-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:5;box-shadow:0 6px 14px rgba(239,68,68,.4);cursor:pointer}
.list-item{padding:10px 12px;border-radius:14px;display:flex;align-items:center;gap:8px;cursor:pointer}

.btn{width:100%;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;padding:12px;border-radius:12px;font-weight:800;font-size:14px;border:none;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.25)}
.action-btn{transition:.35s}.action-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 20px rgba(0,0,0,.12)}
.sec{font-size:9px;letter-spacing:2px;font-weight:800;color:#94a3b8;margin:16px 0 8px 10px;white-space:nowrap}
.input{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:11px 12px;font-size:14px;outline:none;background:#fff}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}
#layout{display:flex}#sidebar{width:290px;flex-shrink:0;height:100vh;position:sticky;top:0;background:#fff;overflow-y:auto;border-right:1px solid #e5e7eb}
#main{flex:1;min-width:0}#sidebar.collapsed{width:72px}#sidebar.collapsed .hide-collapsed{display:none}
#overlay{display:none}.num{font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.filter-btn{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f5f9;border:1px solid #e2e8f0;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:#1e293b;color:#fff}
.float-btn{width:48px;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;cursor:pointer;position:relative;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 10px 22px var(--glow)}
.float-btn:hover{transform:translateY(-6px) scale(1.15) rotate(-5deg);animation:f1 1.6s infinite}
.float-btn .cloud{left:auto;right:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(6px)}
.float-btn:hover .cloud{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}
.donut{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.donut-inner{width:76px;height:76px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
@media(max-width:768px){#sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.25s}#sidebar.open{transform:translateX(0)}#sidebar.collapsed{width:290px}#sidebar.collapsed .hide-collapsed{display:block}#overlay.show{display:block}}
</style></head>

<script>
const DB={get(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};

join('');if(kind==='users')list=items.map(u=>'<div class="card12 p-3 flex justify-between items-center" style="--c:#f97316"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-orange-700" style="background:#ffedd5">'+u.name.charAt(0)+'</div><div><div class="font-bold text-sm">'+u.name+'</div><div class="text-xs text-gray-500">'+u.email+'</div></div></div><button onclick="delItem(\''+key+'\','+u.id+')" class="text-red-500 font-bold action-btn">حذف</button></div>').join('');let form='';if(kind==='contacts')form='<div id="crud-form" class="card12 p-4 mt-3 hidden" style="--c:#9333ea"><input id="f1" class="input" placeholder="الاسم"><input id="f2" class="input mt-2" placeholder="01012345678"><button onclick="saveCRUD(\'contacts\')" class="btn mt-3">حفظ</button></div>';if(kind==='campaigns')form='<div id="crud-form" class="card12 p-4 mt-3 hidden" style="--c:#2563eb"><input id="f1" class="input" placeholder="اسم الحملة"><textarea id="f2" class="input mt-2" rows="3" placeholder="رسالة الحملة..."></textarea><button onclick="saveCRUD(\'campaigns\')" class="btn mt-3">إنشاء</button></div>';if(kind==='numbers')form='<div id="crud-form" class="card12 p-4 mt-3 hidden" style="--c:#16a34a"><input id="f1" class="input" placeholder="اسم الرقم"><input id="f2" class="input mt-2" placeholder="01012345678"><button onclick="saveCRUD(\'numbers\')" class="btn mt-3" style="background:linear-gradient(135deg,#16a34a,#4ade80)">حفظ الرقم</button></div>';if(kind==='users')form='<div id="crud-form" class="card12 p-4 mt-3 hidden" style="--c:#f97316"><input id="f1" class="input" placeholder="اسم المستخدم"><input id="f2" class="input mt-2" placeholder="email@example.com"><button onclick="saveCRUD(\'users\')" class="btn mt-3" style="background:linear-gradient(135deg,#f97316,#fb923c)">حفظ المستخدم</button></div>';return '<div class="flex justify-between"><h2 class="text-xl font-black">'+title+' ('+items.length+')</h2><button onclick="document.getElementById(\'crud-form\').classList.toggle(\'hidden\')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm action-btn">+ Add '+title+'</button></div>'+form+'<div class="mt-3 space-y-2">'+(list||'<div class="card12 p-6 text-center text-gray-400 text-sm">لسه مفيش '+title+'</div>')+'</div>'}
function setFilter(f){S.filter=f;render()}
function togglePage(id){let ps=pages();let p=ps.find(x=>x.id===id);p.enabled=!p.enabled;DB.set('farag_pages',ps);render()}
function toggleSelect(id,v){let ps=pages();ps.find(x=>x.id===id).selected=v;DB.set('farag_pages',ps)}
function toggleSelectAll(v){let ps=pages();ps.forEach(p=>p.selected=v);DB.set('farag_pages',ps);render()}
function loginFacebook(){let name=prompt('اسم الأكونت؟','Yoka Karam');if(!name)return;let a=accounts();a.unshift({id:Date.now(),name:name});DB.set('farag_accounts',a);render();showToast('✅ تم ربط '+name)}
function scanAll(){showToast('⚡ جاري فحص كل الأكونتات...');setTimeout(()=>{render();showToast('✅ تم فحص '+accounts().length+' أكونت')},800)}
function unlinkAccount(id){if(!confirm('متأكد تفك ربط الأكونت؟'))return;DB.set('farag_accounts',accounts().filter(a=>a.id!==id));render();showToast('تم فك الربط')}
function enableAll(){let ps=pages();ps.forEach(p=>p.enabled=true);DB.set('farag_pages',ps);render();showToast('✅ تم تفعيل كل الصفحات')}
function disableAll(){let ps=pages();ps.forEach(p=>p.enabled=false);DB.set('farag_pages',ps);render();showToast('تم إيقاف كل الصفحات')}
function deleteAllPages(){if(!confirm('متأكد تمسح كل الصفحات؟'))return;DB.set('farag_pages',[]);render();showToast('تم مسح كل الصفحات')}
function saveTemplate(){let n=document.getElementById('gt-name')?.value.trim(),tx=document.getElementById('gt-text')?.value.trim();if(!n&&!tx)return alert('اكتب الاسم أو النص');let key={comment:'farag_comment_tpl',reply:'farag_reply_tpl',campaign:'farag_growth_campaigns',tag:'farag_tag_campaigns',bulk:'farag_growth_campaigns'}[S.growth];let a=DB.get(key,[]);a.unshift({id:Date.now(),name:n||'بدون اسم',text:tx});DB.set(key,a);showToast('✅ تم الحفظ');S.growthInner='list';render()}
function openBcCreate(){document.getElementById('bc-create').classList.remove('hidden')}
function saveBc(){let n=document.getElementById('bc-name').value.trim();if(!n)return alert('اكتب اسم البرودكاست');let a=bcs();a.unshift({id:Date.now(),type:'UTILITY',status:'pending',sub:0,sent:0,open:0,sched:'Now',created:new Date().toLocaleString('en-EG'),name:n});DB.set('farag_broadcasts',a);render();showToast('✅ تم إنشاء البرودكاست')}
function delBc(id){if(!confirm('متأكد تحذف؟'))return;DB.set('farag_broadcasts',bcs().filter(x=>x.id!==id));render()}
function addMediaList(){let n=document.getElementById('new-list-name').value.trim();if(!n)return alert('اكتب اسم القائمة');let id=Date.now().toString();let key=S.mediaMode==='media'?'farag_media_lists':S.mediaMode==='content'?'farag_content_lists':'farag_video_lists';let a=DB.get(key,[]);a.unshift({id:id,name:n,count:0});DB.set(key,a);S.activeList=id;render();showToast('✅ تم إنشاء قائمة '+n)}
function delMediaList(id){if(!confirm('متأكد تمسح القائمة؟'))return;let key=S.mediaMode==='media'?'farag_media_lists':S.mediaMode==='content'?'farag_content_lists':'farag_video_lists';DB.set(key,DB.get(key,[]).filter(l=>l.id!==id));S.activeList=DB.get(key,[])[0]?.id||'00';render();showToast('تم مسح القائمة')}
function uploadMedia(e){let files=e.target.files;if(!files.length)return;for(let f of files){if(S.mediaMode==='video'){let v=videos();v.unshift({id:Date.now()+Math.random(),list:S.activeList,title:f.name,file:'1000100058',size:(f.size/1024/1024).toFixed(1)+' MB',thumb:URL.createObjectURL(f)});DB.set('farag_videos',v)}else{let m=mItems();m.unshift({id:Date.now()+Math.random(),url:URL.createObjectURL(f),list:S.activeList,name:f.name,text:f.name});DB.set('farag_media_items',m)}}render();showToast('✅ تم رفع '+files.length+' ملف');e.target.value=''}
function delMediaItem(id){if(!confirm('متأكد تمسح الصورة؟'))return;DB.set('farag_media_items',mItems().filter(x=>x.id!==id));render();showToast('تم مسح الصورة')}
function copyMedia(url){if(navigator.clipboard)navigator.clipboard.writeText(url);showToast('✅ تم نسخ لينك الصورة')}
function randomMedia(){if(S.mediaMode==='content'){let p=posts();if(!p.length)return;let r=p[Math.floor(Math.random()*p.length)];showToast('🔀 Random Post: '+r.text.slice(0,30));return}showToast('🔀 Random URL: تم نسخ لينك عشوائي')}
function addPost(){let t=document.getElementById('post-text').value.trim();if(!t)return alert('اكتب محتوى البوست');let a=posts();a.unshift({id:Date.now(),list:S.activeList,text:t,date:new Date().toISOString().slice(0,19).replace('T',' ')});DB.set('farag_posts',a);render();showToast('✅ تم إضافة البوست')}
function editPost(id){let p=posts().find(x=>x.id===id);let nt=prompt('عدل البوست:',p.text);if(nt){let a=posts();a.find(x=>x.id===id).text=nt;DB.set('farag_posts',a);render();showToast('✅ تم تعديل البوست')}}
function copyPost(id){let p=posts().find(x=>x.id===id);if(navigator.clipboard)navigator.clipboard.writeText(p.text);showToast('✅ تم نسخ البوست')}
function delPost(id){if(!confirm('متأكد تمسح البوست؟'))return;DB.set('farag_posts',posts().filter(x=>x.id!==id));render();showToast('تم مسح البوست')}
function delVideo(id){if(!confirm('متأكد تمسح الفيديو؟'))return;DB.set('farag_videos',videos().filter(x=>x.id!==id));render();showToast('تم مسح الفيديو')}
function saveCRUD(kind){let f1=document.getElementById('f1').value.trim(),f2=document.getElementById('f2').value.trim();if(!f1||!f2)return alert('اكمل البيانات');let key={contacts:'farag_contacts',campaigns:'farag_campaigns',numbers:'farag_numbers',users:'farag_users'}[kind];let a=DB.get(key,[]);if(kind==='contacts')a.unshift({id:Date.now(),name:f1,phone:f2,ts:Date.now()});if(kind==='campaigns')a.unshift({id:Date.now(),name:f1,msg:f2,sent:0,total:contacts().length,status:'Draft',date:new Date().toLocaleString('en-EG')});if(kind==='numbers')a.unshift({id:Date.now(),label:f1,phone:f2});if(kind==='users')a.unshift({id:Date.now(),name:f1,email:f2});DB.set(key,a);render();showToast('تم الحفظ ✅')}
function sendCampaign(id){let a=DB.get('farag_campaigns',[]),c=a.find(x=>x.id===id);if(!c)return;let ct=contacts();if(!ct.length)return alert('ضيف Contacts الأول');c.sent=ct.length;c.total=ct.length;c.status='Done';DB.set('farag_campaigns',a);render();showToast('تم إرسال الحملة لـ '+ct.length)}
function delItem(key,id){if(!confirm('متأكد تحذف؟'))return;DB.set(key,DB.get(key,[]).filter(x=>x.id!==id));render();showToast('تم الحذف')}
function render(){renderSidebar();let h='';if(S.page==='dashboard')h=renderDashboard();else if(S.page==='facebook')h=renderFacebook();else if(S.page==='growth')h=renderGrowth();else if(S.page==='broadcasting')h=renderBroadcast();else if(S.page==='media')h=renderMedia();else if(['contacts','campaigns','numbers','users'].includes(S.page))h=renderCRUD(S.page);else h=renderSimple(S.page,'هنعملها في دورها - ابعتلي صورتها.');document.getElementById('app').innerHTML=h;updateClock()}
render();
</script></body></html>
