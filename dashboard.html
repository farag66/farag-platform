<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARAG.com - Best AI Platform in the World 🌍</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{background:#02010f;background:radial-gradient(900px 450px at 10% 0%,rgba(124,58,237,.62) 0%,transparent 60%),radial-gradient(800px 450px at 95% 10%,rgba(37,99,235,.62) 0%,transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(34,197,94,.38) 0%,transparent 60%),radial-gradient(500px 300px at 50% 50%,rgba(245,158,11,.18) 0%,transparent 60%),linear-gradient(180deg,#02010f,#070b1f 40%,#02010f);font-family:Inter,system-ui;margin:0;min-height:100vh;color:#fff;overflow-x:hidden;perspective:1400px}
body::before{content:'';position:fixed;top:-90px;left:18%;width:400px;height:400px;background:radial-gradient(circle,rgba(124,58,237,.65),transparent 70%);filter:blur(45px);z-index:0;animation:floatAI 6s ease-in-out infinite}
body::after{content:'';position:fixed;bottom:-110px;right:8%;width:460px;height:460px;background:radial-gradient(circle,rgba(37,99,235,.6),transparent 70%);filter:blur(50px);z-index:0;animation:floatAI 8s ease-in-out infinite reverse}
@keyframes floatAI{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-32px) scale(1.12)}}
@keyframes shinePro{0%{transform:translateX(-130%) skewX(-15deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(260%) skewX(-15deg);opacity:0}}
@keyframes orbPro{0%,100%{transform:scale(1) rotate(0deg);box-shadow:0 0 28px rgba(167,139,250,.9),0 0 70px rgba(124,58,237,.6),0 0 110px rgba(37,99,235,.35)}50%{transform:scale(1.12) rotate(8deg);box-shadow:0 0 42px rgba(167,139,250,1),0 0 100px rgba(124,58,237,.8),0 0 140px rgba(37,99,235,.5)}}
@keyframes aiGlow{0%,100%{box-shadow:0 22px 42px rgba(0,0,0,.42),0 0 20px rgba(124,58,237,.25)}50%{box-shadow:0 22px 42px rgba(0,0,0,.42),0 0 38px rgba(124,58,237,.45),0 0 28px rgba(37,99,235,.3)}}
@keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}25%{transform:translateY(-6px) rotate(-4deg) scale(1.08)}50%{transform:translateY(-10px) rotate(3deg) scale(1.12)}75%{transform:translateY(-4px) rotate(-2deg) scale(1.06)}}
@keyframes iconSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}100%{transform:rotate(0deg) scale(1)}}
@keyframes folderLux{0%,100%{transform:translateY(0) rotateX(0deg) scale(1);box-shadow:0 18px 32px rgba(0,0,0,.35),0 0 22px rgba(124,58,237,.22)}50%{transform:translateY(-8px) rotateX(6deg) scale(1.04);box-shadow:0 28px 45px rgba(0,0,0,.45),0 0 38px rgba(124,58,237,.4),0 0 22px rgba(37,99,235,.28)}}
/* حركة فخامة ذكاء اصطناعي - زي ما كنت عاملهالك */
.icon-anim{animation:iconFloat 3.5s ease-in-out infinite;transition:.35s}
.icon-anim:hover{animation:iconSpin .7s ease-in-out;transform:scale(1.3) rotate(-10deg)}
.icon-anim-2{animation:iconFloat 4.2s ease-in-out infinite;animation-delay:.4s}
.icon-anim-3{animation:iconFloat 3s ease-in-out infinite;animation-delay:.8s}
.sidebar-wrap{position:relative;flex-shrink:0;z-index:50}
.sidebar{background:linear-gradient(180deg,rgba(20,26,65,.96),rgba(7,10,30,.99));backdrop-filter:blur(22px);border-left:1px solid rgba(255,255,255,.18);box-shadow:-25px 0 60px rgba(0,0,0,.55),0 0 40px rgba(124,58,237,.3);transition:.4s;width:290px;height:100vh;position:sticky;top:0;overflow-y:auto;overflow-x:hidden}
.sidebar.collapsed{width:72px}.sidebar.collapsed .hide-text{display:none!important}.sidebar.collapsed .side{justify-content:center;padding:10px 6px}.sidebar.collapsed .brand-sub{display:none}
.sidebar-toggle{position:absolute;top:108px;right:-19px;left:auto;width:38px;height:38px;border-radius:50%;border:2px solid #a78bfa;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(124,58,237,.7),0 0 20px rgba(124,58,237,.5);z-index:60;transition:.3s;animation:iconFloat 4s ease-in-out infinite}
.sidebar-toggle:hover{transform:scale(1.18) rotate(10deg)}
.stat{background:linear-gradient(145deg,#1c2658 0%,#0d1230 55%,#141b48 100%);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:16px 10px;text-align:center;position:relative;overflow:hidden;box-shadow:0 20px 38px rgba(0,0,0,.5),0 0 22px rgba(124,58,237,.22);transition:.4s;transform-style:preserve-3d}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#7c3aed,#2563eb,#22c55e,#f59e0b)}
.stat::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),rgba(167,139,250,.15),transparent);animation:shinePro 4.5s ease-in-out infinite}
.stat:hover{transform:translateY(-10px) rotateX(10deg) scale(1.05)}
.side{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:14px;font-weight:700;font-size:13px;color:#cbd5e1;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:.3s;position:relative;overflow:hidden}
.side::after{content:'';position:absolute;top:0;left:-80%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:shinePro 5s ease-in-out infinite;pointer-events:none}
.side:hover{background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(37,99,235,.26));color:#fff;transform:translateX(-5px) scale(1.03)}
.side.active{background:linear-gradient(135deg,#4f46e5,#7c3aed,#a78bfa);color:#fff;box-shadow:0 12px 25px rgba(124,58,237,.65),0 0 22px rgba(124,58,237,.5)}
.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:linear-gradient(145deg,var(--c2),var(--c) 60%,var(--c));box-shadow:0 8px 16px var(--glow),inset 0 2px 4px rgba(255,255,255,.6),0 0 16px var(--glow);transition:.3s;animation:iconFloat 3.8s ease-in-out infinite}
.ico:hover{transform:scale(1.3) rotate(-12deg)}
.grid-ico{background:linear-gradient(145deg,#1c2658,#0d1230 60%,#161d4d);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:18px 8px;text-align:center;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 18px 32px rgba(0,0,0,.45),0 0 20px rgba(124,58,237,.2);transition:.35s;transform-style:preserve-3d}
.grid-ico::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shinePro 4.5s ease-in-out infinite;pointer-events:none}
.grid-ico:hover{transform:translateY(-12px) rotateX(12deg) scale(1.07)}
.grid-ico:hover .ico{transform:scale(1.4) rotate(-12deg)}
.card{background:linear-gradient(180deg,#ffffff,#eef2ff);color:#0f172a;border-radius:22px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.35),0 0 22px rgba(124,58,237,.18);position:relative;overflow:hidden;transform-style:preserve-3d}
.card::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),rgba(167,139,250,.18),transparent);animation:shinePro 4.5s ease-in-out infinite;pointer-events:none;z-index:1}
.input{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:12px;font-size:14px;outline:none;background:#fff;color:#0f172a;position:relative;z-index:2}
.btn{width:100%;background:linear-gradient(145deg,#a78bfa,#7c3aed 55%,#5b21b6);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 12px 22px rgba(124,58,237,.5),0 0 20px rgba(124,58,237,.35);position:relative;overflow:hidden;transition:.3s}
.btn::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shinePro 4s ease-in-out infinite;pointer-events:none}
.btn:hover{transform:translateY(-3px) scale(1.02)}
.btn-blue{background:linear-gradient(145deg,#60a5fa,#2563eb 55%,#1d4ed8);color:#fff;padding:13px;border-radius:14px;font-weight:800;border:none;cursor:pointer;width:100%;box-shadow:0 12px 22px rgba(37,99,235,.5),0 0 20px rgba(37,99,235,.35);position:relative;overflow:hidden;transition:.3s}
.btn-blue::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shinePro 4s ease-in-out infinite;pointer-events:none}
.btn-blue:hover{transform:translateY(-3px) scale(1.02)}
.badge{font-size:11px;padding:4px 9px;border-radius:99px;font-weight:800}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;display:none}.backdrop.show{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px;position:relative;z-index:2}
.icons-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;position:relative;z-index:2}
.glass-panel{background:linear-gradient(145deg,rgba(28,38,88,.92),rgba(13,18,48,.96));border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:18px;box-shadow:0 22px 42px rgba(0,0,0,.42);position:relative;overflow:hidden;animation:aiGlow 3.5s ease-in-out infinite}
.glass-panel::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),rgba(167,139,250,.14),transparent);animation:shinePro 5s ease-in-out infinite;pointer-events:none}
.ai-orb{width:62px;height:62px;border-radius:50%;background:conic-gradient(from 0deg,#7c3aed,#2563eb,#22c55e,#ec4899,#f59e0b,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:28px;animation:orbPro 2.2s ease-in-out infinite;position:relative;flex-shrink:0;cursor:pointer}
.ai-input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:12px 16px;color:#fff;outline:none;font-size:14px}.ai-input::placeholder{color:#94a3b8}
.chart-ultra{background:linear-gradient(180deg,#ffffff 0%,#f1f5ff 55%,#e0e7ff 100%);border-radius:26px;padding:18px;color:#0f172a;position:relative;overflow:hidden;box-shadow:0 28px 55px rgba(0,0,0,.4),0 0 28px rgba(37,99,235,.22);transition:.35s;transform-style:preserve-3d}
.chart-ultra:hover{transform:translateY(-8px) rotateX(5deg) scale(1.02)}
.chart-ultra::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#2563eb,#22c55e,#f59e0b,#ec4899,#7c3aed);z-index:2}
.chart-ultra::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shinePro 4.5s ease-in-out infinite;pointer-events:none;z-index:1}
.donut-ultra{width:184px;height:184px;border-radius:50%;margin:14px auto 0;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 28px 50px rgba(34,197,94,.5),0 0 30px rgba(34,197,94,.35);animation:iconFloat 5s ease-in-out infinite}
.donut-ultra::after{content:'';position:absolute;top:13px;left:24px;width:66px;height:28px;background:rgba(255,255,255,.85);border-radius:99px;filter:blur(7px);transform:rotate(-20deg)}
.donut-in-ultra{width:108px;height:108px;background:radial-gradient(circle at 32% 28%,#ffffff 0%,#eef2ff 55%,#dbeafe 100%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0f172a;position:relative;z-index:2}
.bar-ultra{border-radius:16px 16px 6px 6px;flex:1;position:relative;box-shadow:inset 0 6px 10px rgba(255,255,255,.7),0 18px 26px rgba(37,99,235,.35);transition:.35s;overflow:hidden;animation:iconFloat 4s ease-in-out infinite}
.bar-ultra::before{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.75),transparent)}
.bar-ultra:hover{transform:translateY(-8px) scale(1.06)}
.launch-ultra{background:linear-gradient(145deg,#a78bfa,#7c3aed 55%,#5b21b6);color:#fff;border:none;padding:10px 18px;border-radius:14px;font-weight:900;cursor:pointer;box-shadow:0 14px 25px rgba(124,58,237,.55),0 0 22px rgba(124,58,237,.45);white-space:nowrap;position:relative;overflow:hidden;animation:iconFloat 3s ease-in-out infinite}
.launch-ultra::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shinePro 3.5s ease-in-out infinite;pointer-events:none}
.fab-wrap{position:fixed;left:14px;top:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:10px}
.fab-ai{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#8b5cf6,#7c3aed 55%,#5b21b6);display:flex;align-items:center;justify-content:center;font-size:29px;color:#fff;cursor:pointer;position:relative;box-shadow:0 14px 28px rgba(124,58,237,.6),0 0 26px rgba(124,58,237,.55);transition:.3s;border:2px solid rgba(255,255,255,.3);overflow:hidden;animation:iconFloat 3s ease-in-out infinite}
.fab-ai::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shinePro 3s ease-in-out infinite;pointer-events:none}
.fab-ai:hover{transform:scale(1.15) rotate(-8deg)}
.fab-ai::after{content:'';position:absolute;top:5px;right:6px;width:11px;height:11px;background:#22c55e;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px #22c55e;z-index:2}
.fab-wa{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,#4ade80,#22c55e 55%,#15803d);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 14px 28px rgba(34,197,94,.55),0 0 26px rgba(34,197,94,.5);transition:.3s;border:2px solid rgba(255,255,255,.3);overflow:hidden;animation:iconFloat 3.4s ease-in-out infinite;animation-delay:.4s}
.fab-wa::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shinePro 3s ease-in-out infinite;pointer-events:none}
.fab-wa:hover{transform:scale(1.15) rotate(8deg)}
.fab-wa svg{width:35px;height:35px;fill:#fff;position:relative;z-index:2}.fab-count{font-size:13px;font-weight:900;color:#fff;margin-top:-2px}
.ai-popup{position:fixed;left:86px;top:18px;width:320px;max-width:calc(100vw - 110px);background:linear-gradient(180deg,#1a2456,#0d1230);border:1px solid rgba(167,139,250,.5);border-radius:20px;padding:16px;z-index:9999;display:none;box-shadow:0 25px 50px rgba(0,0,0,.6),0 0 30px rgba(124,58,237,.35)}.ai-popup.show{display:block}
.wa-popup{position:fixed;left:86px;top:92px;width:320px;max-width:calc(100vw - 110px);background:#fff;color:#0f172a;border-radius:20px;padding:16px;z-index:9999;display:none;box-shadow:0 25px 50px rgba(0,0,0,.6),0 0 30px rgba(34,197,94,.35)}.wa-popup.show{display:block}
table.farag-table{width:100%;border-collapse:collapse;background:#fff;color:#0f172a;border-radius:16px;overflow:hidden;position:relative;z-index:2}
table.farag-table th{background:#f1f5f9;padding:12px;text-align:right;font-size:12px;font-weight:900;color:#475569}
table.farag-table td{padding:12px;border-top:1px solid #e2e8f0;font-size:13px;font-weight:700}
.switch{width:64px;height:34px;background:#22c55e;border-radius:99px;position:relative;cursor:pointer;flex-shrink:0;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 14px rgba(34,197,94,.5);display:inline-block;min-width:64px;transition:.3s}
.switch:hover{transform:scale(1.08)}
.switch.off{background:#94a3b8}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.3s}
.switch.off::after{right:33px}
.delete-btn{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;padding:6px 10px;border-radius:99px;font-weight:800;cursor:pointer;font-size:11px;margin-right:8px;position:relative;z-index:2}
.choice-card{background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:12px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}.choice-card.active{border-color:#7c3aed;background:#f5f3ff;box-shadow:0 10px 20px rgba(124,58,237,.25)}
/* فخامة الفولدرات من 50 لـ 100 واكتر */
.folder-card{background:linear-gradient(180deg,#ffffff,#eef2ff);color:#0f172a;border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 18px 32px rgba(0,0,0,.3),0 0 28px rgba(124,58,237,.28),0 0 18px rgba(37,99,235,.18);border:2px solid rgba(167,139,250,.25);position:relative;overflow:hidden;transform-style:preserve-3d;animation:folderLux 4s ease-in-out infinite;transition:.35s}
.folder-card::after{content:'';position:absolute;top:0;left:-80%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),rgba(167,139,250,.2),transparent);animation:shinePro 4s ease-in-out infinite;pointer-events:none}
.folder-card:hover{transform:translateY(-8px) rotateX(10deg) scale(1.06);box-shadow:0 28px 45px rgba(0,0,0,.4),0 0 45px rgba(124,58,237,.5)}
.folder-card.active{border-color:#7c3aed;box-shadow:0 20px 35px rgba(124,58,237,.45)}
.folder-ico{font-size:42px;animation:iconFloat 3.2s ease-in-out infinite;display:inline-block}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(3,1fr)}.icons-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar-wrap{position:fixed;right:0;top:0;height:100vh;transform:translateX(105%);transition:.4s}.sidebar-wrap.open{transform:translateX(0)}.sidebar{width:290px!important}.sidebar.collapsed{width:290px!important}.sidebar.collapsed .hide-text{display:flex!important}.sidebar-toggle{right:-19px;top:108px}.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}.icons-grid{grid-template-columns:repeat(2,1fr);gap:8px}.fab-wrap{left:10px;top:12px}.fab-ai,.fab-wa{width:58px;height:58px}.ai-popup,.wa-popup{left:72px;width:calc(100vw - 90px)}}
</style>
</head>
<body>
<div style="display:flex;flex-direction:row-reverse;position:relative;z-index:2">
<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>
<div class="sidebar-wrap" id="sidebarWrap">
<div class="sidebar" id="sidebar">
<div style="text-align:center;padding:16px 0 6px"><div style="display:flex;align-items:center;justify-content:center;gap:9px"><div class="icon-anim" style="width:44px;height:44px;background:linear-gradient(145deg,#a78bfa,#4f46e5 60%,#312e81);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 0 22px rgba(167,139,250,.7)">F</div><div class="hide-text" style="text-align:right"><div style="font-weight:900;font-size:22px;line-height:1">FARAG<span style="color:#a78bfa">.com</span></div><div class="brand-sub" style="font-size:10px;color:#94a3b8">منصة فرج - Farag AI 🌍 #1 in the World</div></div></div></div>
<div id="menu" style="padding:8px 12px 0"></div>
<button onclick="if(confirm('تصفر كل حاجة؟')){localStorage.clear();location.reload()}" class="hide-text" style="margin:16px 12px 0;width:calc(100% - 24px);background:linear-gradient(145deg,#f87171,#ef4444);color:#fff;padding:11px;border:none;border-radius:14px;font-weight:800;cursor:pointer">Reset / تصفير الكل</button>
</div>
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
</div>
<div style="flex:1;min-width:0;padding:16px;max-width:1150px;margin:0 auto;padding-bottom:60px;width:100%;position:relative;z-index:2">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1 style="font-size:28px;font-weight:900;margin:0">Dashboard - فرج 🤖🌍</h1><p style="color:#94a3b8;font-size:11px;margin:4px 0 0">FARAG.com - Best AI Platform in the World • بعون الله هنوصل للعالمية</p></div><button class="launch-ultra" onclick="go('broadcasting',null)">Launch 🚀</button></div>
<div class="glass-panel" style="margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px"><div class="ai-orb" onclick="aiAsk()"><span style="position:relative;z-index:2">✦</span></div><div style="flex:1;min-width:0"><div style="font-weight:900;font-size:13px">اسأل فرج AI أي حاجة ✨</div><input id="aiInput" class="ai-input" style="margin-top:6px" placeholder="اكتب مثلا: ابعت حملة لـ 1000 واحد..." onkeydown="if(event.key==='Enter')aiAsk()"></div><button onclick="aiAsk()" style="background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;padding:11px 16px;border-radius:99px;font-weight:900;cursor:pointer">اسأل AI ✦</button></div>
<div id="aiAnswer" style="display:none;margin-top:10px;background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(37,99,235,.14));border:1px solid rgba(167,139,250,.35);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.8"></div>
<div id="app"></div>

let box=document.getElementById('newToolBox');box.style.display='block';
box.innerHTML='<div class="card" style="margin-top:12px;border:2px solid #f59e0b"><h3 style="font-weight:900;font-size:18px;margin:0"><span class="icon-anim" style="display:inline-block">💬</span> + New Comment Tool - اداة جديدة</h3><label style="font-size:12px;font-weight:900;display:block;margin-top:12px">1 - اختار الاكونت والصفحات</label><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-top:6px;font-size:13px;line-height:2"><label style="display:flex;gap:8px"><input type="checkbox" checked> <b>اكونت فيسبوك</b> - تحديد الكل</label><div style="padding-right:22px"><label style="display:flex;gap:8px"><input type="checkbox" checked> صفحة انغام</label><label style="display:flex;gap:8px"><input type="checkbox" checked> صفحة جنه</label></div><label style="display:flex;gap:8px;margin-top:6px"><input type="checkbox"> <b>اكونت انستجرام</b> - تحديد الكل</label><div style="padding-right:22px"><label style="display:flex;gap:8px"><input type="checkbox"> صفحة بهية - Instagram</label></div></div><label style="font-size:12px;font-weight:900;display:block;margin-top:12px">2 - انهي بوست؟</label><input id="c-post" class="input" style="margin-top:6px" placeholder="بوست الكورس"><label style="font-size:12px;font-weight:900;display:block;margin-top:10px">3 - انهي كلمة؟</label><input id="c-kw" class="input" style="margin-top:6px" placeholder="تم"><label style="font-size:12px;font-weight:900;display:block;margin-top:12px">4 - هتعمل ايه؟ اختار 1 من 3</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px"><div class="choice-card" onclick="setCommentChoice(\'reply\',this)"><b>1 - رد عام لوحده</b><p style="font-size:12px;color:#64748b;margin:6px 0 0">الخاص هيتبعت تلقائي قالب الترحيب</p></div><div class="choice-card" onclick="setCommentChoice(\'dm\',this)"><b>2 - رسالة خاص لوحدها</b><p style="font-size:12px;color:#64748b;margin:6px 0 0">مش هرد في العام</p></div><div class="choice-card active" onclick="setCommentChoic box.scrollIntoView({behavior:'smooth'});commentChoice='both';
}
function saveCommentTool(){let post=document.getElementById('c-post').value.trim()||'بوست الكورس';let kw=document.getElementById('c-kw').value.trim()||'تم';let reply=document.getElementById('c-reply').value||'بعتلك التفاصيل';let dm=document.getElementById('c-dm').value||'قالب الترحيب';if(commentChoice==='reply'){dm='قالب الترحيب (تلقائي)'}if(commentChoice==='dm'){reply='(مفيش رد عام - خاص بس)'}let a=DB.get('farag_comment_tools',[]);a.unshift({id:Date.now(),post:post,kw:kw,reply:reply,dm:dm,on:true});DB.set('farag_comment_tools',a);alert('اتحفظت الأداة: '+post+' - '+kw);renderComment();}
function toggleTool(id){let a=DB.get('farag_comment_tools',[]);a=a.map(function(t){if(t.id===id)t.on=!t.on;return t});DB.set('farag_comment_tools',a);renderComment();}
function delTool(id){if(!confirm('هتمسح الأداة دي خالص؟ دي مش تشغيل / إيقاف، دي مسح نهائي. متأكد؟'))return;DB.set('farag_comment_tools',DB.get('farag_comment_tools',[]).filter(function(x){return x.id!==id}));renderComment();}
function addReplyTpl(){let v=document.getElementById('newReply').value.trim();if(!v){alert('اكتب الرد الاول');return;}let a=DB.get('farag_reply_tpls',[]);a.push({id:Date.now(),text:v});DB.set('farag_reply_tpls',a);renderComment();}
function delReplyTpl(id){DB.set('farag_reply_tpls',DB.get('farag_reply_tpls',[]).filter(function(x){return x.id!==id}));renderComment();}
function renderPosting(){let posts=DB.get('farag_post_tpl',[{id:1,title:'بوست الترحيب',text:'صلي على النبي واذكر الله ❤️',time:'النهاردة 8 بالليل'}]);let html='<div class="card" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0"><span class="icon-anim" style="display:inline-block">✍️</span> Social Posting - FARAG.com</h2><p style="font-size:13px;color:#64748b;margin:8px 0 0;line-height:1.8"><b>النوع الأول - قوالب حملات الارسال:</b> رسالة في الخاص - في Create Template<br><b>النوع التاني - قوالب النشر:</b> بوست على الصفحة - عنوان + نص + صورة / فيديو + ميعاد نشر</p><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:12px"><b><span class="icon-anim-2" style="display:inline-block">📝</span> Posting Templates</b><input id="pt-title" class="input" style="margin-top:10px" placeholder="عنوان البوست"><textarea id="pt-text" class="input" rows="3" style="margin-top:10px" placeholder="نص البوست..."></textarea><input id="pt-time" class="input" style="margin-top:10px" placeholder="ميعاد النشر - مثلا: النهاردة 8 بالليل"><button class="btn" style="margin-top:12px" onclick="savePostTpl()">💾 حفظ قالب النشر</button></div></div>';document.getElementById('app').innerHTML=html;}
function savePostTpl(){let t=document.getElementById('pt-title').value.trim();if(!t){alert('اكتب عنوان البوست');return;}let a=DB.get('farag_post_tpl',[]);a.unshift({id:Date.now(),title:t,text:document.getElementById('pt-text').value||'نص البوست',time:document.getElementById('pt-time').value||'النهاردة 8'});DB.set('farag_post_tpl',a);alert('اتحفظ قالب النشر');renderPosting();}
function renderMedia(){let folders=DB.get('farag_folders',[{id:1,name:'عروض رمضان',count:12},{id:2,name:'منتجات انغام',count:8},{id:3,name:'فيديوهات بهية',count:5}]);let html='<div class="card" style="margin-top:14px"><h2 style="font-weight:900;font-size:22px;margin:0"><span class="icon-anim" style="display:inline-block">🎬</span> Media & Content - مخزن المنصة - FARAG.com</h2><p style="font-size:13px;color:#64748b;margin:8px 0 0">مخزن + فولدرات بعدد مفتوح - ترفع مرة واحدة، وتستخدم 100 مرة واكتر - صور + فيديوهات + بوستات - فخامة 50 لـ 100 واكتر</p><div style="display:flex;gap:8px;margin-top:12px"><input id="newFolder" class="input" placeholder="اسم فولدر جديد..."><button onclick="addFolder()" style="background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;padding:11px 16px;border-radius:14px;font-weight:900;cursor:pointer;white-space:nowrap">+ فولدر جديد 📂</button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px">';folders.forEach(function(f){html+='<div class="folder-card"><div class="folder-ico">📂</div><b style="font-size:16px">'+f.name+'</b><div style="font-size:12px;color:#64748b;margin-top:4px">'+f.count+' ملف • فخامة 100 واكتر 💎</div><div style="margin-top:10px;display:flex;gap:6px"><span class="badge" style="background:#e0e7ff;color:#3730a3">3D</span><span class="badge" style="background:#dcfce7;color:#15803d">50 → 100</span><span class="badge" style="background:#fef3c7;color:#92400e">💎 فخم</span></div></div>'});html+='</div><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:12px;margin-top:14px;font-size:13px">Create Template و Posting Templates بياخدوا من المخزن ده - ترفع مرة، تستخدم 100 مرة واكتر</div></div>';document.getElementById('app').innerHTML=html;}

function saveTpl(){let n=document.getElementById('t-name').value.trim();if(!n){alert('اكتب اسم القالب');return;}let a=DB.get('farag_tpl',[]);a.unshift({id:Date.now(),name:n,title:document.getElementById('t-title').value,subtitle:document.getElementById('t-sub').value,type:document.getElementById('t-type').value.split(' - ')[0]});DB.set('farag_tpl',a);alert('تم حفظ القالب '+n);renderTemplate();}
