function addPost(){let t=document.getElementById('post-text').value.trim();if(!t)return alert('اكتب محتوى البوست');let a=posts();a.unshift({id:Date.now(),list:S.activeList,text:t,date:new Date().toISOString().slice(0,19).replace('T',' ')});DB.set('farag_posts',a);render();showToast('✅ تم إضافة البوست')}
function editPost(id){let p=posts().find(x=>x.id===id);let nt=prompt('عدل البوست:',p.text);if(nt){let a=posts();a.find(x=>x.id===id).text=nt;DB.set('farag_posts',a);render();showToast('✅ تم تعديل البوست')}}
function copyPost(id){let p=posts().find(x=>x.id===id);if(navigator.clipboard)navigator.clipboard.writeText(p.text);showToast('✅ تم نسخ البوست')}
function delPost(id){if(!confirm('متأكد تمسح البوست؟'))return;DB.set('farag_posts',posts().filter(x=>x.id!==id));render();}
function delVideo(id){if(!confirm('متأكد تمسح الفيديو؟'))return;DB.set('farag_videos',videos().filter(x=>x.id!==id));render();}
function saveCRUD(kind){let f1=document.getElementById('f1').value.trim(),f2=document.getElementById('f2').value.trim();if(!f1||!f2)return alert('اكمل البيانات');let key={contacts:'farag_contacts',campaigns:'farag_campaigns',numbers:'farag_numbers',users:'farag_users'}[kind];let a=DB.get(key,[]);a.unshift({id:Date.now(),name:f1,phone:f2,label:f1,email:f2});DB.set(key,a);render();showToast('تم الحفظ ✅')}
function delItem(key,id){if(!confirm('متأكد تحذف؟'))return;DB.set(key,DB.get(key,[]).filter(x=>x.id!==id));render();showToast('تم الحذف')}
function render(){renderSidebar();let h='';if(S.page==='dashboard')h=renderDashboard();else if(S.page==='facebook')h=renderFacebook();else if(S.page==='growth')h=renderGrowth();else if(S.page==='broadcasting')h=renderBroadcast();else if(S.page==='media')h=renderMedia();else if(['contacts','campaigns','numbers','users'].includes(S.page))h=renderCRUD(S.page);else h=renderSimple(S.page);document.getElementById('app').innerHTML=h;updateClock()}
render();
</script></body></html>
